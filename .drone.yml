---
kind: pipeline
type: docker
name: quality

platform:
  os: linux
  arch: amd64

steps:
  - name: rust
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      # Parallel Drone steps share the checkout. Keep Cargo's transient files
      # out of it so Go's ./... walk cannot race a disappearing rmeta file.
      - export CARGO_TARGET_DIR=/tmp/mini-dynamo-target
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo clippy --locked --all-targets --all-features -- -D warnings
      - cargo test --locked

  - name: go-parity-oracle
    image: golang:1.26.0-bookworm
    pull: if-not-exists
    commands:
      - go test ./...
      - go vet ./...
      - test -z "$(gofmt -l .)"

  - name: agent-protocol
    image: python:3.13-bookworm
    pull: if-not-exists
    commands:
      - bash -n deploy/node06/dspark_0731/sync-compose.sh
      - bash -n deploy/node06/dspark_0731/validate-snapshot-companion-host.sh
      - python3 bench/agentbench.py validate
      - python3 -m unittest discover -s bench -p 'test_*.py'

  - name: quality-complete
    image: alpine:3.23
    pull: if-not-exists
    commands:
      - 'true'
    depends_on:
      - rust
      - go-parity-oracle
      - agent-protocol

  # GHCR publishing lives here, not GitHub Actions: the Actions GITHUB_TOKEN
  # is denied write_package on the existing ghcr.io/helixml/mini-dynamo
  # package (issue #39). Requires two Drone repository secrets:
  #   ghcr_username — account with write access to the package
  #   ghcr_token    — a PAT with the write:packages scope
  # The push-event guard keeps secrets away from pull_request builds; the
  # pipeline trigger already limits push events to main.
  - name: publish-image
    image: plugins/docker
    pull: if-not-exists
    environment:
      # The Dockerfile's `syntax` directive and cargo cache mounts need
      # BuildKit; the plugin's docker CLI inherits this.
      DOCKER_BUILDKIT: "1"
    settings:
      registry: ghcr.io
      repo: ghcr.io/helixml/mini-dynamo
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      tags:
        - rust-${DRONE_COMMIT_SHA:0:7}
        - rust-edge
    when:
      event:
        - push
    depends_on:
      - quality-complete

trigger:
  event:
    - push
    - pull_request
  branch:
    # Pull requests targeting main still run. Feature-branch pushes no longer
    # duplicate the same cold Rust build beside their PR build; main pushes
    # retain the post-merge gate.
    - main
