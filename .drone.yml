---
kind: pipeline
type: docker
name: quality

platform:
  os: linux
  arch: amd64

steps:
  - name: rust
    image: rust:1.95-bookworm
    pull: if-not-exists
    volumes:
      # Host-backed caches make repeat runs warm instead of paying a cold
      # dependency download and full rebuild each time. Cargo's own file
      # locking serializes concurrent runs sharing these directories.
      # Host volumes require this repository to be marked Trusted in Drone.
      - name: cargo-registry
        path: /usr/local/cargo/registry
      - name: cargo-target
        path: /drone/cargo-target
    commands:
      # Parallel Drone steps share the checkout. Keep Cargo's transient files
      # out of it so Go's ./... walk cannot race a disappearing rmeta file.
      - export CARGO_TARGET_DIR=/drone/cargo-target
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo clippy --locked --all-targets --all-features -- -D warnings
      - cargo test --locked

  - name: go-parity-oracle
    image: golang:1.26.0-bookworm
    pull: if-not-exists
    commands:
      - go test ./...
      - go vet ./...
      - test -z "$(gofmt -l .)"

  - name: agent-protocol
    image: python:3.13-bookworm
    pull: if-not-exists
    commands:
      - bash -n deploy/node06/dspark_0731/sync-compose.sh
      - bash -n deploy/node06/dspark_0731/validate-snapshot-companion-host.sh
      - python3 bench/agentbench.py validate
      - python3 -m unittest discover -s bench -p 'test_*.py'

  - name: quality-complete
    image: alpine:3.23
    pull: if-not-exists
    commands:
      - 'true'
    depends_on:
      - rust
      - go-parity-oracle
      - agent-protocol

  # GHCR publishing lives here, not GitHub Actions: the Actions GITHUB_TOKEN
  # is denied write_package on the existing ghcr.io/helixml/mini-dynamo
  # package (issue #39). Requires two Drone repository secrets:
  #   ghcr_username — account with write access to the package
  #   ghcr_token    — a token with the write:packages scope
  # The build uses the runner host's Docker daemon (not dind) so the
  # Dockerfile's BuildKit cargo cache mounts persist across runs: an
  # unchanged-dependency publish pays only the crate's release relink.
  # The push-event guard keeps secrets away from pull_request builds; the
  # pipeline trigger already limits push events to main.
  - name: publish-image
    image: docker:27-cli
    pull: if-not-exists
    volumes:
      - name: docker-socket
        path: /var/run/docker.sock
    environment:
      DOCKER_BUILDKIT: "1"
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - echo "$GHCR_TOKEN" | docker login ghcr.io -u "$GHCR_USERNAME" --password-stdin
      - docker build
        -t ghcr.io/helixml/mini-dynamo:rust-${DRONE_COMMIT_SHA:0:7}
        -t ghcr.io/helixml/mini-dynamo:rust-edge .
      - docker push ghcr.io/helixml/mini-dynamo:rust-${DRONE_COMMIT_SHA:0:7}
      - docker push ghcr.io/helixml/mini-dynamo:rust-edge
      - docker logout ghcr.io
    when:
      event:
        - push
    depends_on:
      - quality-complete

volumes:
  # Host volumes and the host Docker socket require the Trusted flag on this
  # repository in Drone. The repository is private, so pull requests cannot
  # arrive from untrusted forks.
  - name: cargo-registry
    host:
      path: /var/cache/mini-dynamo/cargo-registry
  - name: cargo-target
    host:
      path: /var/cache/mini-dynamo/cargo-target
  - name: docker-socket
    host:
      path: /var/run/docker.sock

trigger:
  event:
    - push
    - pull_request
  branch:
    # Pull requests targeting main still run. Feature-branch pushes no longer
    # duplicate the same cold Rust build beside their PR build; main pushes
    # retain the post-merge gate.
    - main
