---
kind: pipeline
type: docker
name: quality

platform:
  os: linux
  arch: amd64

steps:
  - name: rust
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo clippy --locked --all-targets --all-features -- -D warnings
      - cargo test --locked
      - cargo build --release --locked

  - name: go-parity-oracle
    image: golang:1.26.0-bookworm
    pull: if-not-exists
    commands:
      - go test ./...
      - go vet ./...
      - test -z "$(gofmt -l .)"

  - name: agent-protocol
    image: python:3.13-bookworm
    pull: if-not-exists
    commands:
      - bash -n deploy/node06/dspark_0731/sync-compose.sh
      - python3 bench/agentbench.py validate
      - python3 -m unittest discover -s bench -p 'test_*.py'

  - name: quality-complete
    image: alpine:3.23
    pull: if-not-exists
    commands:
      - 'true'
    depends_on:
      - rust
      - go-parity-oracle
      - agent-protocol

trigger:
  event:
    - push
    - pull_request
