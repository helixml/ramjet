---
kind: pipeline
type: docker
name: quality

platform:
  os: linux
  arch: amd64

steps:
  # Fetch once into a pipeline-scoped volume, then compile Clippy and tests in
  # parallel. They use separate target directories because Cargo artifacts
  # from the two profiles are not interchangeable.
  - name: rust-fetch
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - cargo fetch --locked
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry

  - name: rust-lint
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - export CARGO_TARGET_DIR=/tmp/mini-dynamo-clippy-target
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo clippy --locked --all-targets --all-features -- -D warnings
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry
    depends_on:
      - rust-fetch

  - name: rust-test
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - export CARGO_TARGET_DIR=/tmp/mini-dynamo-test-target
      - cargo test --locked
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry
    depends_on:
      - rust-fetch

  - name: agent-protocol
    image: python:3.13-bookworm
    pull: if-not-exists
    commands:
      - python3 bench/agentbench.py validate
      - python3 -m unittest discover -s bench -p 'test_*.py'

  - name: deployment-compose
    image: docker:29-cli
    pull: if-not-exists
    commands:
      - apk add --no-cache bash python3
      - bash -n deploy/dspark_0731/sync-compose.sh
      - bash -n deploy/dspark_0731/validate-snapshot-companion-host.sh
      - bash -n deploy/dspark_0731/validate-snapshot-production-host.sh
      - docker compose -f deploy/dspark_0731/docker-compose.yaml config --quiet
      - python3 deploy/dspark_0731/validate-snapshot-companion-compose.py
      - python3 deploy/dspark_0731/validate-snapshot-production-compose.py

  - name: quality-complete
    image: alpine:3.23
    pull: if-not-exists
    commands:
      - 'true'
    depends_on:
      - rust-lint
      - rust-test
      - agent-protocol
      - deployment-compose

  # Compile the locked dependency graph once per manifest/toolchain/dependency
  # Dockerfile key. The content-addressed tag is then an explicit base image,
  # not a best-effort BuildKit cache hint. Drone corrects dependencies around
  # this conditionally skipped step for source-only pushes.
  - name: publish-rust-deps-image
    image: plugins/docker
    pull: if-not-exists
    environment:
      DOCKER_BUILDKIT: "1"
    settings:
      registry: ghcr.io
      repo: ghcr.io/helixml/mini-dynamo
      dockerfile: Dockerfile.deps
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      tags:
        - rust-deps-sha256-73812d07a8a087cd8dfc6d3a882ebdc01be55451e465b4faed964881249cc33a
    when:
      event:
        - push
      paths:
        include:
          - Cargo.toml
          - Cargo.lock
          - rust-toolchain.toml
          - Dockerfile.deps
          - .docker/rust-deps-key
    depends_on:
      - quality-complete

  # GHCR publishing lives here, not GitHub Actions. The push-event guard keeps
  # registry credentials out of pull-request builds. Both release images wait
  # for a dependency seed when its inputs changed; otherwise Drone removes the
  # skipped dependency from the graph.
  - name: publish-image
    image: plugins/docker
    pull: if-not-exists
    environment:
      DOCKER_BUILDKIT: "1"
    settings:
      registry: ghcr.io
      repo: ghcr.io/helixml/mini-dynamo
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      tags:
        - rust-${DRONE_COMMIT_SHA:0:7}
        - rust-edge
    when:
      event:
        - push
      paths:
        include:
          - Cargo.toml
          - Cargo.lock
          - rust-toolchain.toml
          - Dockerfile
          - compat/**
          - src/**
    depends_on:
      - quality-complete
      - publish-rust-deps-image

  # The snapshot companion is a separate, off-by-default executable and image.
  # Build it only when its Rust/build inputs change; it shares the same explicit
  # dependency image as the ordinary LB.
  - name: publish-companion-image
    image: plugins/docker
    pull: if-not-exists
    environment:
      DOCKER_BUILDKIT: "1"
    settings:
      registry: ghcr.io
      repo: ghcr.io/helixml/mini-dynamo
      dockerfile: Dockerfile.companion
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      tags:
        - companion-rust-${DRONE_COMMIT_SHA:0:7}
        - companion-rust-edge
    when:
      event:
        - push
      paths:
        include:
          - Cargo.toml
          - Cargo.lock
          - rust-toolchain.toml
          - Dockerfile.companion
          - src/**
    depends_on:
      - quality-complete
      - publish-rust-deps-image

trigger:
  event:
    - push
    - pull_request
  branch:
    # Pull requests targeting main still run. Feature-branch pushes no longer
    # duplicate the same cold Rust build beside their PR build; main pushes
    # retain the post-merge gate.
    - main

volumes:
  - name: cargo-registry
    temp: {}
