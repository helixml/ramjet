---
kind: pipeline
type: docker
name: quality

platform:
  os: linux
  arch: amd64

# Deadline-sensitive transport tests and their two Rust compilation lanes must
# not compete with a superseded build of this same pipeline on one runner.
concurrency:
  limit: 1

steps:
  # Fetch once into a pipeline-scoped volume, then compile Clippy and tests in
  # parallel. They use separate target directories because Cargo artifacts
  # from the two profiles are not interchangeable.
  - name: rust-fetch
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - cargo fetch --locked
      - sh bench/drone_publish_plan.sh
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry

  - name: rust-lint
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - export CARGO_TARGET_DIR=/tmp/mini-dynamo-clippy-target
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo clippy --locked --all-targets --all-features -- -D warnings
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry
    depends_on:
      - rust-fetch

  - name: rust-test
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - export CARGO_TARGET_DIR=/tmp/mini-dynamo-test-target
      - cargo test --locked
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry
    depends_on:
      - rust-fetch

  - name: agent-protocol
    image: python:3.13-bookworm
    pull: if-not-exists
    commands:
      - python3 bench/agentbench.py validate
      - python3 -m unittest discover -s bench -p 'test_*.py'

  - name: deployment-compose
    image: docker:29-cli
    pull: if-not-exists
    commands:
      - apk add --no-cache bash python3
      - bash -n deploy/dspark_0731/sync-compose.sh
      - bash -n deploy/dspark_0731/validate-snapshot-companion-host.sh
      - bash -n deploy/dspark_0731/validate-snapshot-production-host.sh
      - bash -n deploy/dspark_0731/validate-persistent-jit-cache-host.sh
      - docker compose -f deploy/dspark_0731/docker-compose.yaml config --quiet
      - python3 deploy/dspark_0731/validate-persistent-jit-cache-compose.py
      - python3 deploy/dspark_0731/validate-snapshot-companion-compose.py
      - python3 deploy/dspark_0731/validate-snapshot-production-compose.py
      - python3 deploy/dspark_0731/validate-serving-identity-compose.py
      - python3 deploy/dspark_0731/validate-dspark-guard-compose.py
      - python3 deploy/dspark_0731/infernal-r11-candidate/validate-compose.py
      - python3 -m unittest bench.test_persistent_jit_cache_compose bench.test_snapshot_production_compose bench.test_serving_identity_compose bench.test_dspark_guard_compose bench.test_dspark_guard_host bench.test_infernal_r11_compose

  - name: quality-complete
    image: alpine:3.23
    pull: if-not-exists
    commands:
      - 'true'
    depends_on:
      - rust-lint
      - rust-test
      - agent-protocol
      - deployment-compose

  # Drone 2.12 silently discards `when.paths`, so every publisher has a
  # fail-closed repository-side changeset guard. A nonmatching step exits before
  # registry login or Kaniko; an unavailable revision is an error, not publish.
  - name: publish-rust-deps-image
    image: gcr.io/kaniko-project/executor@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    pull: if-not-exists
    environment:
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - |
        status=0
        sh bench/drone_publish_guard.sh rust-deps || status=$?
        if [ "$status" -eq 3 ]; then exit 0; fi
        if [ "$status" -ne 0 ]; then exit "$status"; fi
        auth=$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 | tr -d '\n')
        mkdir -p /kaniko/.docker
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" >/kaniko/.docker/config.json
        exec /kaniko/executor --context . --dockerfile Dockerfile.deps \
          --destination ghcr.io/helixml/mini-dynamo:rust-deps-sha256-7da447db3053012bff0f7070cfe7a354d74406e3919b2b9d0ec360371911078d \
          --cache=true --cache-repo=ghcr.io/helixml/mini-dynamo-build-cache \
          --cache-ttl=336h --snapshot-mode=redo --reproducible
    when:
      event:
        - push
    depends_on:
      - quality-complete

  - name: publish-release-tools-image
    image: gcr.io/kaniko-project/executor@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    pull: if-not-exists
    environment:
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - |
        status=0
        sh bench/drone_publish_guard.sh release-tools || status=$?
        if [ "$status" -eq 3 ]; then exit 0; fi
        if [ "$status" -ne 0 ]; then exit "$status"; fi
        auth=$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 | tr -d '\n')
        mkdir -p /kaniko/.docker
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" >/kaniko/.docker/config.json
        exec /kaniko/executor --context . --dockerfile Dockerfile.release-tools \
          --destination ghcr.io/helixml/mini-dynamo:release-tools-sha256-244bfd3b33987aedfd342ca70253320cda509bd4d6bc3aac6320b87fd50c5733 \
          --cache=true --cache-repo=ghcr.io/helixml/mini-dynamo-build-cache \
          --cache-ttl=336h --snapshot-mode=redo --reproducible
    when:
      event:
        - push
    depends_on:
      - quality-complete

  # GHCR publishing lives here, not GitHub Actions. The push-event guard keeps
  # registry credentials out of pull-request builds. Both release images wait
  # for the dependency guard; a dependency-input change seeds the required base
  # before either app publisher starts.
  - name: publish-image
    image: gcr.io/kaniko-project/executor@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    pull: if-not-exists
    environment:
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - |
        status=0
        sh bench/drone_publish_guard.sh lb || status=$?
        if [ "$status" -eq 3 ]; then exit 0; fi
        if [ "$status" -ne 0 ]; then exit "$status"; fi
        auth=$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 | tr -d '\n')
        mkdir -p /kaniko/.docker
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" >/kaniko/.docker/config.json
        exec /kaniko/executor --context . --dockerfile Dockerfile \
          --destination ghcr.io/helixml/mini-dynamo:rust-${DRONE_COMMIT_SHA:0:7} \
          --destination ghcr.io/helixml/mini-dynamo:rust-edge \
          --build-arg OCI_REVISION=${DRONE_COMMIT_SHA} \
          --cache=true --cache-repo=ghcr.io/helixml/mini-dynamo-build-cache \
          --cache-ttl=336h --snapshot-mode=redo --reproducible
    when:
      event:
        - push
    depends_on:
      - quality-complete
      - publish-rust-deps-image

  # The snapshot companion is a separate, off-by-default executable and image.
  # Build it only when its Rust/build inputs change; it shares the same explicit
  # dependency image as the ordinary LB.
  - name: publish-companion-image
    image: gcr.io/kaniko-project/executor@sha256:2562c4fe551399514277ffff7dcca9a3b1628c4ea38cb017d7286dc6ea52f4cd
    pull: if-not-exists
    environment:
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - |
        status=0
        sh bench/drone_publish_guard.sh companion || status=$?
        if [ "$status" -eq 3 ]; then exit 0; fi
        if [ "$status" -ne 0 ]; then exit "$status"; fi
        auth=$(printf '%s:%s' "$GHCR_USERNAME" "$GHCR_TOKEN" | base64 | tr -d '\n')
        mkdir -p /kaniko/.docker
        printf '{"auths":{"ghcr.io":{"auth":"%s"}}}' "$auth" >/kaniko/.docker/config.json
        exec /kaniko/executor --context . --dockerfile Dockerfile.companion \
          --destination ghcr.io/helixml/mini-dynamo:companion-rust-${DRONE_COMMIT_SHA:0:7} \
          --destination ghcr.io/helixml/mini-dynamo:companion-rust-edge \
          --build-arg OCI_REVISION=${DRONE_COMMIT_SHA} \
          --cache=true --cache-repo=ghcr.io/helixml/mini-dynamo-build-cache \
          --cache-ttl=336h --snapshot-mode=redo --reproducible
    when:
      event:
        - push
    depends_on:
      - quality-complete
      - publish-rust-deps-image

trigger:
  event:
    - push
    - pull_request
  branch:
    # Pull requests targeting main still run. Feature-branch pushes no longer
    # duplicate the same cold Rust build beside their PR build; main pushes
    # retain the post-merge gate.
    - main

volumes:
  - name: cargo-registry
    temp: {}

---
kind: pipeline
type: docker
name: release-tags

platform:
  os: linux
  arch: amd64

steps:
  - name: release-fetch
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - sh bench/drone_release_plan.sh
      - cargo fetch --locked
    volumes:
      - name: release-cargo-registry
        path: /usr/local/cargo/registry

  - name: release-rust-lint
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - export CARGO_TARGET_DIR=/tmp/mini-dynamo-release-clippy-target
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo clippy --locked --all-targets --all-features -- -D warnings
    volumes:
      - name: release-cargo-registry
        path: /usr/local/cargo/registry
    depends_on:
      - release-fetch

  - name: release-rust-test
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - export CARGO_TARGET_DIR=/tmp/mini-dynamo-release-test-target
      - cargo test --locked
    volumes:
      - name: release-cargo-registry
        path: /usr/local/cargo/registry
    depends_on:
      - release-fetch

  - name: release-agent-protocol
    image: python:3.13-bookworm
    pull: if-not-exists
    commands:
      - python3 bench/agentbench.py validate
      - python3 -m unittest discover -s bench -p 'test_*.py'

  - name: release-deployment-compose
    image: docker:29-cli
    pull: if-not-exists
    commands:
      - apk add --no-cache bash python3
      - bash -n deploy/dspark_0731/sync-compose.sh
      - bash -n deploy/dspark_0731/validate-snapshot-companion-host.sh
      - bash -n deploy/dspark_0731/validate-snapshot-production-host.sh
      - docker compose -f deploy/dspark_0731/docker-compose.yaml config --quiet
      - python3 deploy/dspark_0731/validate-snapshot-companion-compose.py
      - python3 deploy/dspark_0731/validate-snapshot-production-compose.py
      - python3 deploy/dspark_0731/validate-serving-identity-compose.py
      - python3 deploy/dspark_0731/validate-dspark-guard-compose.py
      - python3 -m unittest bench.test_snapshot_production_compose bench.test_serving_identity_compose bench.test_dspark_guard_compose bench.test_dspark_guard_host

  - name: release-quality-complete
    image: alpine:3.23
    pull: if-not-exists
    commands:
      - 'true'
    depends_on:
      - release-rust-lint
      - release-rust-test
      - release-agent-protocol
      - release-deployment-compose

  - name: release-image
    image: ghcr.io/helixml/mini-dynamo:release-tools-sha256-244bfd3b33987aedfd342ca70253320cda509bd4d6bc3aac6320b87fd50c5733@sha256:1d0d9c383119f43b832008d2b2866c43472175bf0d814d27032b677e30dcac43
    pull: if-not-exists
    environment:
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - export PATH=/ko-app:$PATH
      - sh bench/drone_release_publish.sh lb
    when:
      event:
        - tag
    depends_on:
      - release-quality-complete

  - name: release-companion-image
    image: ghcr.io/helixml/mini-dynamo:release-tools-sha256-244bfd3b33987aedfd342ca70253320cda509bd4d6bc3aac6320b87fd50c5733@sha256:1d0d9c383119f43b832008d2b2866c43472175bf0d814d27032b677e30dcac43
    pull: if-not-exists
    environment:
      GHCR_USERNAME:
        from_secret: ghcr_username
      GHCR_TOKEN:
        from_secret: ghcr_token
    commands:
      - export PATH=/ko-app:$PATH
      - sh bench/drone_release_publish.sh companion
    when:
      event:
        - tag
    depends_on:
      - release-quality-complete

trigger:
  event:
    - tag
  ref:
    - refs/tags/v*

volumes:
  - name: release-cargo-registry
    temp: {}
