---
kind: pipeline
type: docker
name: quality

platform:
  os: linux
  arch: amd64

steps:
  # Fetch once into a pipeline-scoped volume, then compile Clippy and tests in
  # parallel. They use separate target directories because Cargo artifacts
  # from the two profiles are not interchangeable.
  - name: rust-fetch
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - cargo fetch --locked
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry

  - name: rust-lint
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - export CARGO_TARGET_DIR=/tmp/mini-dynamo-clippy-target
      - rustup component add rustfmt clippy
      - cargo fmt --check
      - cargo clippy --locked --all-targets --all-features -- -D warnings
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry
    depends_on:
      - rust-fetch

  - name: rust-test
    image: rust:1.95-bookworm
    pull: if-not-exists
    commands:
      - export CARGO_TARGET_DIR=/tmp/mini-dynamo-test-target
      - cargo test --locked
    volumes:
      - name: cargo-registry
        path: /usr/local/cargo/registry
    depends_on:
      - rust-fetch

  - name: go-parity-oracle
    image: golang:1.26.0-bookworm
    pull: if-not-exists
    commands:
      - go test ./...
      - go vet ./...
      - test -z "$(gofmt -l .)"

  - name: agent-protocol
    image: python:3.13-bookworm
    pull: if-not-exists
    commands:
      - python3 bench/agentbench.py validate
      - python3 -m unittest discover -s bench -p 'test_*.py'

  - name: deployment-compose
    image: docker:29-cli
    pull: if-not-exists
    commands:
      - apk add --no-cache bash python3
      - bash -n deploy/node06/dspark_0731/sync-compose.sh
      - bash -n deploy/node06/dspark_0731/validate-snapshot-companion-host.sh
      - docker compose -f deploy/node06/dspark_0731/docker-compose.yaml config --quiet
      - python3 deploy/node06/dspark_0731/validate-snapshot-companion-compose.py

  - name: quality-complete
    image: alpine:3.23
    pull: if-not-exists
    commands:
      - 'true'
    depends_on:
      - rust-lint
      - rust-test
      - go-parity-oracle
      - agent-protocol
      - deployment-compose

  # GHCR publishing lives here, not GitHub Actions. The push-event guard keeps
  # registry credentials out of pull-request builds.
  - name: publish-image
    image: plugins/docker
    pull: if-not-exists
    environment:
      DOCKER_BUILDKIT: "1"
    settings:
      registry: ghcr.io
      repo: ghcr.io/helixml/mini-dynamo
      username:
        from_secret: ghcr_username
      password:
        from_secret: ghcr_token
      tags:
        - rust-${DRONE_COMMIT_SHA:0:7}
        - rust-edge
      # The Dockerfile uses locked BuildKit Cargo registry/target cache mounts.
      # Keep those caches across main builds; the runner owns disk GC policy.
      purge: false
    when:
      event:
        - push
    depends_on:
      - quality-complete

trigger:
  event:
    - push
    - pull_request
  branch:
    # Pull requests targeting main still run. Feature-branch pushes no longer
    # duplicate the same cold Rust build beside their PR build; main pushes
    # retain the post-merge gate.
    - main

volumes:
  - name: cargo-registry
    temp: {}
