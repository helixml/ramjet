[package]
name = "ramjet"
version = "0.5.0"
edition = "2024"
rust-version = "1.95"
description = "Token- and KV-cache-aware inference router"
license = "Apache-2.0"
repository = "https://github.com/helixml/ramjet"
publish = false
readme = "README.md"
include = [
    "src/**",
    "examples/**",
    "compat/**",
    "Cargo.toml",
    "Cargo.lock",
    "README.md",
    "CHANGELOG.md",
    "RELEASE.md",
    "LICENSE",
]

[dependencies]
anyhow = "1.0.104"
axum = { version = "0.8.9", features = ["http1", "http2", "tokio", "ws"] }
bytes = "1.12.1"
chrono = { version = "0.4.45", default-features = false, features = ["std"] }
dynamo-protocols = "5.3.1"
dynamo-renderer = "5.0.1"
fastokens = "0.3.1"
futures = "0.3.34"
futures-util = "0.3.34"
getrandom = "0.3.4"
lru = "0.18.2"
minijinja = "2.23.0"
parking_lot = "0.12.5"
prometheus = { version = "0.14.0", default-features = false }
reqwest = { version = "0.13.4", default-features = false, features = ["http2", "rustls", "stream"] }
rmp-serde = "1.3.1"
serde = { version = "1.0.229", features = ["derive"] }
serde_bytes = "0.11.19"
serde_json = "1.0.151"
sha2 = "0.11.0"
thiserror = "2.0.20"
tokio = { version = "1.53.1", features = ["io-util", "macros", "net", "rt-multi-thread", "signal", "sync", "time"] }
tokio-stream = "0.1.17"
tracing = "0.1.44"
tracing-subscriber = { version = "0.3.23", features = ["env-filter", "fmt", "json"] }
url = "2.5.8"
zeromq = { version = "0.6.0", default-features = false, features = ["tcp-transport", "tokio-runtime"] }
zmq = "0.10.0"

[dev-dependencies]
tokio = { version = "1.53.1", features = ["test-util"] }

[profile.release]
codegen-units = 1
lto = "thin"
panic = "abort"
strip = "symbols"

[lints.rust]
unsafe_code = "forbid"

[lints.clippy]
all = "warn"
pedantic = "warn"
