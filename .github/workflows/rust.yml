name: rust

on:
  workflow_dispatch:
  pull_request:
  push:
    branches: [main]
    tags: ['v*']

permissions:
  contents: read

concurrency:
  group: rust-${{ github.event.pull_request.number || github.ref }}
  # PRs and main check only their newest commit. Version-tag runs are never
  # superseded and must run to completion.
  cancel-in-progress: ${{ github.event_name == 'pull_request' || github.ref == 'refs/heads/main' }}

jobs:
  check:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v5
      - name: Install pinned Rust toolchain
        run: rustup toolchain install 1.95.0 --profile minimal --component clippy,rustfmt
      - name: Restore Cargo dependency cache
        uses: Swatinem/rust-cache@v2
        with:
          shared-key: quality
          cache-on-failure: true
      - run: cargo fmt --check
      - run: cargo clippy --locked --all-targets --all-features -- -D warnings
      - run: cargo test --locked
      - name: Validate node06 deployment
        run: |
          bash -n deploy/node06/dspark_0731/sync-compose.sh
          bash -n deploy/node06/dspark_0731/validate-snapshot-companion-host.sh
          docker compose -f deploy/node06/dspark_0731/docker-compose.yaml config --quiet
          deploy/node06/dspark_0731/validate-snapshot-companion-compose.py

  # Container publishing moved to Drone's post-merge `publish-image` step: the
  # Actions GITHUB_TOKEN is denied write_package on the existing GHCR package
  # (issue #39), while Drone holds a PAT-backed registry secret.
