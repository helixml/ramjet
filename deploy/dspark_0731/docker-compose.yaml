# Canonical source: helixml/ramjet/deploy/dspark_0731/docker-compose.yaml
# The infra repository and node06 checkout contain generated mirrors; edit here first.
# DeepSeek-V4-Flash-0731 + DSpark on RTX PRO 6000 Blackwell (SM120), x86.
# Based on jacklarmer/deepseek-v4-flash-0731-sm120 (measured: 231.5 tok/s
# single-stream decode, ~749 tok/s aggregate @8-way on 4 GPUs, prose/pessimistic).
# Requires driver >=590 (cu132 images) — node06 upgraded to 595.84 2026-08-11.
#
# Deltas vs upstream recipe compose:
#   - no privileged, no host networking: loopback publish like the rest of the
#     stack (fall back to their exact settings only if SparkInfer's PCIe
#     allreduce turns out to need them)
#   - GPUs parameterized; trial instance on 0-3 (:8012) while SGLang keeps
#     serving on 4-7
#   - disable-custom-all-reduce retained via ALLREDUCE_MODE=nccl. A node06 A/B
#     rejected b12x for unified serving; a later matched A/B promoted NCCL PCIe
#     peer access (`NCCL_P2P_DISABLE=0`) on this specific topology.
#
# Known-good/known-bad (from the recipe): kv fp8_ds_mla ONLY; DCP must be 1;
# num_speculative_tokens >= 5; block 256. The pinned r34 launcher selects
# VLLM_USE_B12X_FP8_GEMM=1 for b12x-a16 after reading Compose; do not claim an
# ineffective Compose override. The opt-in runtime manifest attests the final
# exec environment.
# The WHOLE serving stack lives in this one compose project: both engines and
# the load balancer shares the project network, so it reaches engines by
# service name — no manual `docker network connect`/aliases. Put the Caddy
# bearer in ./.env on the box (VLLM_API_KEY=...) and `docker compose up -d`
# brings up everything.
services:
  # Load balancer: sticky conversation affinity with failover, Zed
  # compat shims, /v1/models context-margin rewrite, Prometheus metrics
  # (:8007 -> Caddy :9105) and engine-native metrics passthrough.
  ds4-loadbalancer:
    # Replaces the retired ghcr.io/helixml/mini-dynamo:rust-b0e0700 pin. This
    # stack is not currently deployed -- node06 serves the qwen38_27b stack --
    # so v0.2.0 here is the current default, not a qualified rollout. Qualify
    # before reviving this stack.
    image: ${LB_IMAGE:-ghcr.io/helixml/ramjet:v0.4.0@sha256:467e7edf40c8fcad29e741cbba52ca571cbae0261d94cff008aa6bcdb737ea1b}
    container_name: ds4-loadbalancer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8006:8000"
      - "127.0.0.1:8007:9090"
    volumes:
      # Read-only tokenizer artifact for the opt-in Rust local-shadow mode.
      - ${MODEL_DIR:-/prod/models/DeepSeek-V4-Flash-0731}/tokenizer.json:/models/tokenizer.json:ro
    environment:
      RJ_UPSTREAM: ${RJ_UPSTREAM:-http://dspark-0731:8000,http://dspark-0731-b:8000}
      RJ_UPSTREAM_TOKEN: ${VLLM_API_KEY:-dspark-local}
      RJ_ADVERTISE_CTX_MARGIN: ${RJ_ADVERTISE_CTX_MARGIN:-131072}
      RJ_ROUTE_ALPHA: ${RJ_ROUTE_ALPHA:-4}
      RJ_ROUTE_LOAD_UNIT_BYTES: ${RJ_ROUTE_LOAD_UNIT_BYTES:-32768}
      RJ_ROUTE_MAX_LOAD_UNITS: ${RJ_ROUTE_MAX_LOAD_UNITS:-8}
      RJ_ROUTE_MAX_PREFIX_BYTES: ${RJ_ROUTE_MAX_PREFIX_BYTES:-2097152}
      RJ_ROUTE_MAX_OVERLAP_BLOCKS: ${RJ_ROUTE_MAX_OVERLAP_BLOCKS:-32}
      # Privacy-bounded decision snapshots for offline alpha/cap replay.
      RJ_ROUTE_JOURNAL: ${RJ_ROUTE_JOURNAL:-true}
      # Exact tokenization is telemetry-only until the KV-event index is fenced.
      RJ_TOKENIZER_MODE: ${RJ_TOKENIZER_MODE:-local-shadow}
      RJ_TOKENIZER_PATH: ${RJ_TOKENIZER_PATH:-/models/tokenizer.json}
      # Versioned local-renderer admission: update only with a fresh golden run.
      RJ_TOKENIZER_PROFILE: ${RJ_TOKENIZER_PROFILE:-deepseek-v4-r34}
      RJ_TOKENIZER_SHA256: ${RJ_TOKENIZER_SHA256:-8f9f37ca37fdc4f5fd36d5cf4d3b0e8392edb4e894fd10cc0d70b4957c8633cf}
      RJ_TOKENIZER_MIN_BYTES: ${RJ_TOKENIZER_MIN_BYTES:-32768}
      RJ_TOKENIZER_MAX_BYTES: ${RJ_TOKENIZER_MAX_BYTES:-2097152}
      RJ_TOKENIZER_WORKERS: ${RJ_TOKENIZER_WORKERS:-1}
      RJ_TOKENIZER_QUEUE_CAPACITY: ${RJ_TOKENIZER_QUEUE_CAPACITY:-8}
      RJ_TOKENIZER_TIMEOUT_MS: ${RJ_TOKENIZER_TIMEOUT_MS:-2000}
      # Pre-route exact IDs and KV lookup remain counterfactual-only. The
      # manifest is embedded in the immutable LB image and SHA-pinned here.
      RJ_EXACT_ROUTE_MODE: ${RJ_EXACT_ROUTE_MODE:-shadow}
      RJ_EXACT_ROUTE_MANIFEST_PATH: ${RJ_EXACT_ROUTE_MANIFEST_PATH:-/compat/deepseek-v4-r34.json}
      RJ_EXACT_ROUTE_MANIFEST_SHA256: ${RJ_EXACT_ROUTE_MANIFEST_SHA256:-4ae2503554fa7089bc455e2ee89af0677c5cabec523d6b08d91a93d9ec9259aa}
      # Optional serving admission stays permissive until separately qualified.
      RJ_UPSTREAM_ADMISSION_MODE: ${RJ_UPSTREAM_ADMISSION_MODE:-http}
      RJ_UPSTREAM_ADMISSION_TIMEOUT_MS: ${RJ_UPSTREAM_ADMISSION_TIMEOUT_MS:-5000}
      # DSpark degeneration detection stays off until cooling repair and a
      # one-TP4 observe-mode qualification. Quarantine additionally requires
      # compatibility admission plus the separate durable-state overlay; only
      # a changed attested EngineCore set can durably rearm.
      RJ_DSPARK_GUARD_MODE: ${RJ_DSPARK_GUARD_MODE:-off}
      RJ_DSPARK_GUARD_INTERVAL_MS: ${RJ_DSPARK_GUARD_INTERVAL_MS:-5000}
      RJ_DSPARK_GUARD_CONSECUTIVE_WINDOWS: ${RJ_DSPARK_GUARD_CONSECUTIVE_WINDOWS:-3}
      RJ_DSPARK_GUARD_MIN_PROPOSED_TOKENS: ${RJ_DSPARK_GUARD_MIN_PROPOSED_TOKENS:-256}
      RJ_DSPARK_GUARD_EXPECTED_POSITIONS: ${RJ_DSPARK_GUARD_EXPECTED_POSITIONS:-5}
      RJ_EXACT_ROUTE_WORKERS: ${RJ_EXACT_ROUTE_WORKERS:-8}
      RJ_EXACT_ROUTE_TIMEOUT_MS: ${RJ_EXACT_ROUTE_TIMEOUT_MS:-250}
      # Placement stays disabled by default. A nonzero percentage additionally
      # requires a secret in the uncommitted node .env and one X-Session-ID.
      RJ_EXACT_ROUTE_CANARY_BPS: ${RJ_EXACT_ROUTE_CANARY_BPS:-0}
      RJ_EXACT_ROUTE_CANARY_KEY: ${RJ_EXACT_ROUTE_CANARY_KEY:-}
      # Stateless primary/secondary session assignment is observation-only.
      # The independent key stays in the uncommitted node .env when enabled.
      RJ_SESSION_AFFINITY_MODE: ${RJ_SESSION_AFFINITY_MODE:-off}
      RJ_SESSION_AFFINITY_KEY: ${RJ_SESSION_AFFINITY_KEY:-}
      RJ_SESSION_AFFINITY_BONUS_BLOCKS: ${RJ_SESSION_AFFINITY_BONUS_BLOCKS:-4}
      RJ_SESSION_AFFINITY_MAX_LOAD_DELTA: ${RJ_SESSION_AFFINITY_MAX_LOAD_DELTA:-0}
      # One-shot served-request qualification. Marked capture requires the
      # authenticated snapshot-shadow overlay; the later comparison loop is
      # in-memory and does not dispatch additional inference.
      RJ_SHADOW_SOAK_MODE: ${RJ_SHADOW_SOAK_MODE:-off}
      RJ_SHADOW_SOAK_SOURCE_TARGET: ${RJ_SHADOW_SOAK_SOURCE_TARGET:-104}
      RJ_SHADOW_SOAK_COMPARISON_TARGET: ${RJ_SHADOW_SOAK_COMPARISON_TARGET:-100000}
      RJ_SHADOW_SOAK_ATTEMPT_LIMIT: ${RJ_SHADOW_SOAK_ATTEMPT_LIMIT:-110000}
      RJ_SHADOW_SOAK_MAX_TOKEN_BYTES: ${RJ_SHADOW_SOAK_MAX_TOKEN_BYTES:-100663296}
      RJ_SHADOW_SOAK_TIMEOUT_MS: ${RJ_SHADOW_SOAK_TIMEOUT_MS:-300000}
      # Native KV inventory remains observation-only. Shadow mode and the
      # matching per-engine r34 publishers are now the qualified defaults.
      RJ_KV_EVENT_MODE: ${RJ_KV_EVENT_MODE:-shadow}
      RJ_KV_EVENT_LIVE_ENDPOINTS: ${RJ_KV_EVENT_LIVE_ENDPOINTS:-tcp://dspark-0731:5557,tcp://dspark-0731-b:5557}
      RJ_KV_EVENT_REPLAY_ENDPOINTS: ${RJ_KV_EVENT_REPLAY_ENDPOINTS:-tcp://dspark-0731:5558,tcp://dspark-0731-b:5558}
      RJ_KV_EVENT_TOPIC: "${RJ_KV_EVENT_TOPIC:-}"
      # The publisher retains 10K scheduler steps, but near-retention replay
      # can stall its synchronous publisher for minutes. Claim only the tested
      # 8K recovery envelope; older generations remain fenced/observe-only.
      RJ_KV_EVENT_REPLAY_LIMIT: ${RJ_KV_EVENT_REPLAY_LIMIT:-8192}
      RJ_KV_EVENT_REPLAY_TAIL_LIMIT: ${RJ_KV_EVENT_REPLAY_TAIL_LIMIT:-64}
      # Valid in-envelope replay stays fail-closed at one total deadline;
      # snapshot/tree-dump recovery replaces replay for older generations.
      RJ_KV_EVENT_TIMEOUT_MS: ${RJ_KV_EVENT_TIMEOUT_MS:-180000}

  dspark-0731:
    image: ${IMAGE_A:-${IMAGE:-voipmonitor/vllm:gilded-gnosis-v20-vllm4d006a4-b12xcd3ce19-fi1ac6942-cu132-20260810-r34}}
    container_name: ${NAME:-dspark-0731}
    entrypoint: ["/usr/local/bin/serve-ds4-flash.sh"]
    restart: unless-stopped
    ipc: host
    init: true
    shm_size: 32gb
    # GPUs 0-3 are local to NUMA node 0. First-touch memory allocation follows
    # these CPUs, avoiding cross-socket host/PCIe traffic.
    cpuset: "0-11,24-35"
    ulimits:
      memlock: -1
      stack: 67108864
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "127.0.0.1:${HOST_PORT:-8012}:8000"
    volumes:
      - ${MODEL_DIR:-/prod/models/DeepSeek-V4-Flash-0731}:/workspace/model:ro
      - /prod/engine-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: "0,1,2,3"
      PORT: "8000"
      MODEL_ROOT: /workspace/model
      SERVED_MODEL_NAME: deepseek-v4-flash
      MODE: dspark
      # K5 beat r34's K7 default on node06 at code and prose concurrency.
      DSPARK_TOKENS: ${DSPARK_TOKENS:-5}
      DSPARK_DEPTH_MODE: ${DSPARK_DEPTH_MODE_A:-fixed}
      # Opt-in aggregate controller diagnostics; zero avoids steady-state log
      # volume. Per-engine controls keep rolling dynamic-depth trials isolated.
      DSPARK_CAPACITY_LOG_INTERVAL: ${DSPARK_CAPACITY_LOG_INTERVAL_A:-0}
      DSPARK_STS_LOG_INTERVAL: ${DSPARK_STS_LOG_INTERVAL_A:-0}
      # A16 MoE kernels win 5-16% on code and 7-10% on prose decode.
      BACKEND: ${BACKEND:-b12x-a16}
      TP_SIZE: "4"
      DCP_SIZE: "1"
      ALLREDUCE_MODE: ${ALLREDUCE_MODE:-nccl}
      # node06's PCIe P2P path passed direct decode/mixed/200K-context A/B.
      NCCL_P2P_DISABLE: ${NCCL_P2P_DISABLE:-0}
      # This is the launcher input. 0.975 was already r34's effective default;
      # spelling it explicitly does not change the live allocation.
      GPU_MEMORY_UTILIZATION: "0.975"
      MAX_MODEL_LEN: "393216"
      # Parameterized for rolling concurrency/graph-memory qualification.
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-16}
      # Scheduler quantum; parameterized for rolling mixed-prefill A/B tests.
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-4096}
      BLOCK_SIZE: "256"
      # Native CPU KV offload is disabled by default; qualify only as a
      # rolling one-engine experiment because node06 host RAM is constrained.
      KV_OFFLOADING_SIZE: ${KV_OFFLOADING_SIZE:-}
      # Qualified native KV publisher by default; keep A/B independently
      # overridable for rolling trials and event-off rollback.
      #
      # The model ships generation_config.json with top_p 1.0, and vLLM adopts
      # it as the server-side default (engine boot logs the override). Helix
      # does not send top_p, so agent traffic would otherwise sample the full
      # tail, which the model authors report can emit a malformed tool call and
      # poison the conversation. 0.95 is the recommended value and is what
      # bench/agentbench.py already uses for its agentic profile. An explicit
      # client top_p still wins; this is only a floor for callers that omit it.
      # Overriding EXTRA_VLLM_ARGS_A drops both this and the KV publisher --
      # copy them into any experiment value.
      EXTRA_VLLM_ARGS: '${EXTRA_VLLM_ARGS_A---kv-events-config {"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","replay_endpoint":"tcp://*:5558","buffer_steps":10000,"hwm":100000,"max_queue_size":100000,"topic":""} --override-generation-config {"top_p":0.95}}'
      VLLM_API_KEY: ${VLLM_API_KEY:-dspark-local}

  # Second instance, GPUs 4-7. Both are joined to ds4_flash_default with
  # aliases dspark / dspark-b for the load balancer's sticky routing (launch order:
  # docker network connect --alias dspark-b ds4_flash_default dspark-0731-b).
  dspark-0731-b:
    image: ${IMAGE_B:-${IMAGE:-voipmonitor/vllm:gilded-gnosis-v20-vllm4d006a4-b12xcd3ce19-fi1ac6942-cu132-20260810-r34}}
    container_name: dspark-0731-b
    entrypoint: ["/usr/local/bin/serve-ds4-flash.sh"]
    restart: unless-stopped
    ipc: host
    init: true
    shm_size: 32gb
    # GPUs 4-7 are local to NUMA node 1.
    cpuset: "12-23,36-47"
    ulimits:
      memlock: -1
      stack: 67108864
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "127.0.0.1:8013:8000"
    volumes:
      - ${MODEL_DIR:-/prod/models/DeepSeek-V4-Flash-0731}:/workspace/model:ro
      - /prod/engine-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4", "5", "6", "7"]
              capabilities: [gpu]
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: "0,1,2,3"
      PORT: "8000"
      MODEL_ROOT: /workspace/model
      SERVED_MODEL_NAME: deepseek-v4-flash
      MODE: dspark
      DSPARK_TOKENS: ${DSPARK_TOKENS:-5}
      DSPARK_DEPTH_MODE: ${DSPARK_DEPTH_MODE_B:-fixed}
      DSPARK_CAPACITY_LOG_INTERVAL: ${DSPARK_CAPACITY_LOG_INTERVAL_B:-0}
      DSPARK_STS_LOG_INTERVAL: ${DSPARK_STS_LOG_INTERVAL_B:-0}
      BACKEND: ${BACKEND:-b12x-a16}
      TP_SIZE: "4"
      DCP_SIZE: "1"
      ALLREDUCE_MODE: ${ALLREDUCE_MODE:-nccl}
      NCCL_P2P_DISABLE: ${NCCL_P2P_DISABLE:-0}
      GPU_MEMORY_UTILIZATION: "0.975"
      MAX_MODEL_LEN: "393216"
      MAX_NUM_SEQS: ${MAX_NUM_SEQS:-16}
      MAX_NUM_BATCHED_TOKENS: ${MAX_NUM_BATCHED_TOKENS:-4096}
      BLOCK_SIZE: "256"
      KV_OFFLOADING_SIZE: ${KV_OFFLOADING_SIZE:-}
      # See engine A: pins the recommended top_p 0.95 floor for callers that
      # omit it. Overriding EXTRA_VLLM_ARGS_B drops both this and the KV
      # publisher -- copy them into any experiment value.
      EXTRA_VLLM_ARGS: '${EXTRA_VLLM_ARGS_B---kv-events-config {"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","replay_endpoint":"tcp://*:5558","buffer_steps":10000,"hwm":100000,"max_queue_size":100000,"topic":""} --override-generation-config {"top_p":0.95}}'
      VLLM_API_KEY: ${VLLM_API_KEY:-dspark-local}
