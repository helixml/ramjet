# Boot-time /run authority parents for the snapshot companion (issue #158).
#
# /run is tmpfs and is wiped on every reboot. systemd-tmpfiles-setup.service
# runs early in boot, well before docker.service, so these parents exist before
# Docker restores any `unless-stopped` container. That is what keeps a
# container-create mount failure -- the #156 failure mode, which is silent
# because it is not a process exit and never retries -- from recurring.
#
# This fragment creates DIRECTORIES ONLY. Secret and attestation *files* are
# created by ramjet-snapshot-authority.service, which runs
# setup_snapshot_production_host.py with exclusive creation. Keeping the two
# concerns split matters: a tmpfiles fragment must never invent secret material,
# and a directory that exists but holds no secret is a companion that fails
# readiness rather than a load balancer that cannot start.
#
# Ownership/mode policy mirrors what the companion itself enforces at runtime:
# companion-owned, setgid, group-traversable, not writable by group or other.
# Session GID 12000 is the snapshot/session authority group; metrics GIDs
# 12004/12005 are deliberately distinct so Caddy/Prometheus can be granted
# metrics access without ever joining the session group.
#
# Install to /etc/tmpfiles.d/ramjet-snapshot.conf.
# Apply without rebooting: systemd-tmpfiles --create /etc/tmpfiles.d/ramjet-snapshot.conf

#Type Path                                        Mode UID   GID   Age Argument

# Companion socket parents. Mode 2750: companion-owned, session group may
# traverse to reach the socket, other has no access.
d /run/ramjet-snapshot-a                      2750 12001 12000 -   -
d /run/ramjet-snapshot-b                      2750 12003 12000 -   -

# Attestation parents. The authenticated incarnation file is published into
# these by the provisioner; the directory alone carries no authority.
d /run/ramjet-snapshot-attestation-a          2750 12001 12000 -   -
d /run/ramjet-snapshot-attestation-b          2750 12003 12000 -   -

# Metrics parents. Distinct per-engine groups, never the session group, so a
# scraper added to 12004/12005 cannot reach session or digest material.
d /run/ramjet-snapshot-metrics-a              2750 12001 12004 -   -
d /run/ramjet-snapshot-metrics-b              2750 12003 12005 -   -

# Secret parent. Root-owned; individual secrets are mode 0640 root:12000 and
# are written only by the provisioner unit.
d /run/secrets                                     0755 0     0     -   -
