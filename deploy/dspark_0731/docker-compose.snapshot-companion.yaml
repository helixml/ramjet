# Production-shaped, explicitly enabled snapshot-companion overlay.
#
# Render and validate before use:
#   docker compose -f docker-compose.yaml \
#     -f docker-compose.snapshot-companion.yaml \
#     --profile snapshot-companion config --quiet
#
# The ordinary stack never reads this file. This overlay adds only companion
# and provisioner services: it never modifies ds4-loadbalancer, so applying it
# cannot couple its /run tmpfs state to the production serving path. The LB-side
# snapshot wiring lives in the separate docker-compose.snapshot-lb.yaml, which
# must be listed explicitly and requires the boot-time authority units under
# systemd/. See #156/#157 for why that separation exists.
#
# Snapshot routing itself remains off unless RJ_SNAPSHOT_ROUTE_MODE=shadow is
# set explicitly.

x-snapshot-companion-production: &snapshot-companion-production
  profiles: [snapshot-companion]
  image: ${SNAPSHOT_COMPANION_IMAGE:-ghcr.io/helixml/ramjet:companion-v0.5.0@sha256:d6504e2a1cad6dc3a611084c0c2143ccb90d8025c372b59d3d91aac036e31d13}
  restart: unless-stopped
  init: true
  ipc: private
  read_only: true
  privileged: false
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 128
  cpus: 1.0
  mem_limit: 512m
  mem_reservation: 128m
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700
  environment: &snapshot-companion-environment
    RJ_SNAPSHOT_COMPANION_MODE: serve
    RJ_SNAPSHOT_SOCKET_PATH: /run/ramjet-snapshot/companion.sock
    RJ_SNAPSHOT_CLIENT_UID: "12002"
    RJ_SNAPSHOT_SECRET_PATH: /run/secrets/snapshot-session
    RJ_SNAPSHOT_SECRET_OWNER_UID: "0"
    RJ_SNAPSHOT_DIGEST_SECRET_PATH: /run/secrets/snapshot-digest
    RJ_SNAPSHOT_ATTESTATION_PATH: /run/attestation/engine.json
    RJ_SNAPSHOT_MAX_CLIENTS: "2"
    RJ_SNAPSHOT_TAIL_QUEUE_CAPACITY: "1024"
    RJ_SNAPSHOT_TAIL_QUEUE_MAX_BYTES: "16777216"
    RJ_SNAPSHOT_DEADLINE_MS: "3000"
    RJ_SNAPSHOT_TAIL_IDLE_DEADLINE_MS: "30000"
    RJ_SNAPSHOT_SHUTDOWN_DEADLINE_MS: "5000"
    RJ_SNAPSHOT_REPLAY_LIMIT: "10000"
    RJ_SNAPSHOT_REPLAY_TAIL_LIMIT: "1024"
    RJ_SNAPSHOT_CONNECT_TIMEOUT_MS: "2000"
    RJ_SNAPSHOT_REPLAY_TIMEOUT_MS: "300000"
    RJ_SNAPSHOT_RECONNECT_MIN_MS: "250"
    RJ_SNAPSHOT_RECONNECT_MAX_MS: "5000"
    RJ_SNAPSHOT_ATTESTATION_REFRESH_MS: "1000"
    RJ_SNAPSHOT_BLOCK_SIZE: "256"
    RJ_SNAPSHOT_ATTENTION_KIND: mla
    RJ_SNAPSHOT_DATA_PARALLEL_RANK: "0"
    RJ_SNAPSHOT_GROUP_INDEX: "0"

x-snapshot-attestation-provisioner: &snapshot-attestation-provisioner
  profiles: [snapshot-attestation]
  image: ${SNAPSHOT_COMPANION_IMAGE:-ghcr.io/helixml/ramjet:companion-v0.5.0@sha256:d6504e2a1cad6dc3a611084c0c2143ccb90d8025c372b59d3d91aac036e31d13}
  entrypoint: ["/ramjet-attestation-provisioner"]
  restart: "no"
  user: "0:12000"
  network_mode: none
  ipc: private
  read_only: true
  privileged: false
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  pids_limit: 32
  cpus: 0.25
  mem_limit: 64m
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=4m,mode=0700
  environment: &snapshot-attestation-environment
    RJ_SNAPSHOT_ENGINE_METADATA_PATH: /run/metadata/engine.json
    RJ_SNAPSHOT_DIGEST_SECRET_PATH: /run/secrets/snapshot-digest
    RJ_SNAPSHOT_ATTESTATION_PATH: /run/attestation/engine.json
    RJ_SNAPSHOT_SECRET_OWNER_UID: "0"
    RJ_SNAPSHOT_SECRET_GROUP_GID: "12000"
    RJ_SNAPSHOT_ATTESTATION_MAX_AGE_MS: "30000"

services:
  snapshot-companion-a:
    <<: *snapshot-companion-production
    container_name: snapshot-companion-a
    user: "12001:12000"
    group_add: ["12004"]
    environment:
      <<: *snapshot-companion-environment
      RJ_SNAPSHOT_COMPANION_UID: "12001"
      RJ_SNAPSHOT_LIVE_ENDPOINTS: tcp://dspark-0731:5557
      RJ_SNAPSHOT_REPLAY_ENDPOINTS: tcp://dspark-0731:5558
      RJ_SNAPSHOT_METRICS_SOCKET_PATH: /run/ramjet-metrics/metrics.sock
      RJ_SNAPSHOT_METRICS_GROUP_GID: "12004"
    volumes:
      - type: bind
        source: ${SNAPSHOT_RUNTIME_DIR_A:-/run/ramjet-snapshot-a.invalid}
        target: /run/ramjet-snapshot
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_METRICS_DIR_A:-/run/ramjet-snapshot-metrics-a.invalid}
        target: /run/ramjet-metrics
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_SESSION_SECRET_FILE_A:-/run/secrets/ramjet-snapshot-session-a.invalid}
        target: /run/secrets/snapshot-session
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_DIGEST_SECRET_FILE_A:-/run/secrets/ramjet-snapshot-digest-a.invalid}
        target: /run/secrets/snapshot-digest
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_ATTESTATION_DIR_A:-/run/ramjet-snapshot-attestation-a.invalid}
        target: /run/attestation
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/ramjet-snapshot-companion", "healthcheck", "/run/ramjet-snapshot/companion.sock"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    labels:
      org.helixml.ramjet.engine: engine-a
      org.helixml.ramjet.role: snapshot-companion

  snapshot-companion-b:
    <<: *snapshot-companion-production
    container_name: snapshot-companion-b
    user: "12003:12000"
    group_add: ["12005"]
    environment:
      <<: *snapshot-companion-environment
      RJ_SNAPSHOT_COMPANION_UID: "12003"
      RJ_SNAPSHOT_LIVE_ENDPOINTS: tcp://dspark-0731-b:5557
      RJ_SNAPSHOT_REPLAY_ENDPOINTS: tcp://dspark-0731-b:5558
      RJ_SNAPSHOT_METRICS_SOCKET_PATH: /run/ramjet-metrics/metrics.sock
      RJ_SNAPSHOT_METRICS_GROUP_GID: "12005"
    volumes:
      - type: bind
        source: ${SNAPSHOT_RUNTIME_DIR_B:-/run/ramjet-snapshot-b.invalid}
        target: /run/ramjet-snapshot
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_METRICS_DIR_B:-/run/ramjet-snapshot-metrics-b.invalid}
        target: /run/ramjet-metrics
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_SESSION_SECRET_FILE_B:-/run/secrets/ramjet-snapshot-session-b.invalid}
        target: /run/secrets/snapshot-session
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_DIGEST_SECRET_FILE_B:-/run/secrets/ramjet-snapshot-digest-b.invalid}
        target: /run/secrets/snapshot-digest
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_ATTESTATION_DIR_B:-/run/ramjet-snapshot-attestation-b.invalid}
        target: /run/attestation
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test: ["CMD", "/ramjet-snapshot-companion", "healthcheck", "/run/ramjet-snapshot/companion.sock"]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    labels:
      org.helixml.ramjet.engine: engine-b
      org.helixml.ramjet.role: snapshot-companion

  snapshot-attestation-a:
    <<: *snapshot-attestation-provisioner
    container_name: snapshot-attestation-a
    environment:
      <<: *snapshot-attestation-environment
    volumes:
      - type: bind
        source: ${SNAPSHOT_ENGINE_METADATA_FILE_A:-/run/ramjet-engine-metadata-a.invalid}
        target: /run/metadata/engine.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_DIGEST_SECRET_FILE_A:-/run/secrets/ramjet-snapshot-digest-a.invalid}
        target: /run/secrets/snapshot-digest
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_ATTESTATION_DIR_A:-/run/ramjet-snapshot-attestation-a.invalid}
        target: /run/attestation
        bind:
          create_host_path: false
    labels:
      org.helixml.ramjet.engine: engine-a
      org.helixml.ramjet.role: attestation-provisioner

  snapshot-attestation-b:
    <<: *snapshot-attestation-provisioner
    container_name: snapshot-attestation-b
    environment:
      <<: *snapshot-attestation-environment
    volumes:
      - type: bind
        source: ${SNAPSHOT_ENGINE_METADATA_FILE_B:-/run/ramjet-engine-metadata-b.invalid}
        target: /run/metadata/engine.json
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_DIGEST_SECRET_FILE_B:-/run/secrets/ramjet-snapshot-digest-b.invalid}
        target: /run/secrets/snapshot-digest
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_ATTESTATION_DIR_B:-/run/ramjet-snapshot-attestation-b.invalid}
        target: /run/attestation
        bind:
          create_host_path: false
    labels:
      org.helixml.ramjet.engine: engine-b
      org.helixml.ramjet.role: attestation-provisioner
