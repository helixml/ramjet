# Offline-only security contract for two independent per-engine companions.
#
# This standalone file is never merged with the canonical production project.
# Every service requires the explicit `snapshot-companion-offline` profile.
# Reserved `.invalid` images and fixture-only commands make accidental startup
# impossible until independently pinned harness images are supplied.
#
# Each engine has its own host-tmpfs runtime directory, Unix socket, root-owned
# 32-byte session secret, companion service, and client fixture. No service
# mounts the other engine's authority or fixture domain. The clients model two independent
# LB owner tasks; failure or readiness loss in one pair cannot publish, inspect,
# or authenticate the peer socket.
#
# Host preflight:
#   SNAPSHOT_RUNTIME_DIR_A=/run/mini-dynamo-snapshot-offline-a \
#   SNAPSHOT_RUNTIME_DIR_B=/run/mini-dynamo-snapshot-offline-b \
#   SNAPSHOT_SESSION_SECRET_FILE_A=/run/secrets/mini-dynamo-snapshot-session-a \
#   SNAPSHOT_SESSION_SECRET_FILE_B=/run/secrets/mini-dynamo-snapshot-session-b \
#     ./validate-snapshot-companion-host.sh
#
# Render only (starts nothing):
#   docker compose -f docker-compose.snapshot-companion-offline.yaml \
#     --profile snapshot-companion-offline config --quiet

x-snapshot-sandbox: &snapshot-sandbox
  profiles: [snapshot-companion-offline]
  restart: "no"
  init: true
  network_mode: none
  ipc: private
  read_only: true
  privileged: false
  cap_drop: [ALL]
  security_opt:
    - no-new-privileges:true
  ulimits:
    nofile:
      soft: 1024
      hard: 1024
    nproc:
      soft: 128
      hard: 128
  labels:
    org.helixml.mini-dynamo.scope: offline-non-production

x-snapshot-client: &snapshot-client
  <<: *snapshot-sandbox
  image: ${SNAPSHOT_LB_IMAGE:-snapshot-lb.invalid/mini-dynamo:not-built}
  user: "12002:12000"
  pids_limit: 64
  cpus: 0.5
  mem_limit: 256m
  mem_reservation: 64m
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=8m,mode=0700

x-snapshot-companion: &snapshot-companion
  <<: *snapshot-sandbox
  image: ${SNAPSHOT_COMPANION_IMAGE:-snapshot-companion.invalid/mini-dynamo:not-built}
  pids_limit: 128
  cpus: 1.0
  mem_limit: 512m
  mem_reservation: 128m
  tmpfs:
    - /tmp:rw,noexec,nosuid,nodev,size=16m,mode=0700

services:
  snapshot-lb-offline-a:
    <<: *snapshot-client
    container_name: snapshot-lb-offline-a
    command:
      [
        "snapshot-client-fixture",
        "--engine-id=engine-a",
        "--socket=/run/mini-dynamo-snapshot-a/companion-a.sock",
        "--secret=/run/secrets/snapshot-session-a",
        "--fixtures=/fixtures",
        "--expected-peer-uid=12001",
      ]
    volumes:
      - type: bind
        source: ${SNAPSHOT_RUNTIME_DIR_A:-/run/mini-dynamo-snapshot-offline-a.invalid}
        target: /run/mini-dynamo-snapshot-a
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_SESSION_SECRET_FILE_A:-/run/secrets/mini-dynamo-snapshot-session-a.invalid}
        target: /run/secrets/snapshot-session-a
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_FIXTURE_DIR_A:-./snapshot-fixtures-a.invalid}
        target: /fixtures
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "/mini-dynamo",
          "snapshot-client-healthcheck",
          "/run/mini-dynamo-snapshot-a/companion-a.sock",
        ]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    labels:
      org.helixml.mini-dynamo.scope: offline-non-production
      org.helixml.mini-dynamo.engine: engine-a
      org.helixml.mini-dynamo.role: client

  snapshot-companion-offline-a:
    <<: *snapshot-companion
    container_name: snapshot-companion-offline-a
    user: "12001:12000"
    command:
      [
        "snapshot-companion-fixture",
        "--engine-id=engine-a",
        "--socket=/run/mini-dynamo-snapshot-a/companion-a.sock",
        "--secret=/run/secrets/snapshot-session-a",
        "--fixtures=/fixtures",
        "--expected-client-uid=12002",
        "--max-clients=2",
        "--tail-queue-capacity=1024",
        "--snapshot-deadline-ms=3000",
        "--tail-idle-deadline-ms=30000",
        "--shutdown-deadline-ms=5000",
      ]
    volumes:
      - type: bind
        source: ${SNAPSHOT_RUNTIME_DIR_A:-/run/mini-dynamo-snapshot-offline-a.invalid}
        target: /run/mini-dynamo-snapshot-a
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_SESSION_SECRET_FILE_A:-/run/secrets/mini-dynamo-snapshot-session-a.invalid}
        target: /run/secrets/snapshot-session-a
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_FIXTURE_DIR_A:-./snapshot-fixtures-a.invalid}
        target: /fixtures
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
          "/mini-dynamo-snapshot-companion",
          "healthcheck",
          "/run/mini-dynamo-snapshot-a/companion-a.sock",
        ]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    labels:
      org.helixml.mini-dynamo.scope: offline-non-production
      org.helixml.mini-dynamo.engine: engine-a
      org.helixml.mini-dynamo.role: companion

  snapshot-lb-offline-b:
    <<: *snapshot-client
    container_name: snapshot-lb-offline-b
    command:
      [
        "snapshot-client-fixture",
        "--engine-id=engine-b",
        "--socket=/run/mini-dynamo-snapshot-b/companion-b.sock",
        "--secret=/run/secrets/snapshot-session-b",
        "--fixtures=/fixtures",
        "--expected-peer-uid=12003",
      ]
    volumes:
      - type: bind
        source: ${SNAPSHOT_RUNTIME_DIR_B:-/run/mini-dynamo-snapshot-offline-b.invalid}
        target: /run/mini-dynamo-snapshot-b
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_SESSION_SECRET_FILE_B:-/run/secrets/mini-dynamo-snapshot-session-b.invalid}
        target: /run/secrets/snapshot-session-b
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_FIXTURE_DIR_B:-./snapshot-fixtures-b.invalid}
        target: /fixtures
        read_only: true
        bind:
          create_host_path: false
    healthcheck:
      test:
        [
          "CMD",
