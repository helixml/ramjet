      ]
    volumes:
      - type: bind
        source: ${SNAPSHOT_RUNTIME_DIR_B:-/run/mini-dynamo-snapshot-offline-b.invalid}
        target: /run/mini-dynamo-snapshot-b
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_SESSION_SECRET_FILE_B:-/run/secrets/mini-dynamo-snapshot-session-b.invalid}
        target: /run/secrets/snapshot-session-b
        read_only: true
        bind:
          create_host_path: false
      - type: bind
        source: ${SNAPSHOT_FIXTURE_DIR_B:-./snapshot-fixtures-b.invalid}
        target: /fixtures
        read_only: true
        bind:
