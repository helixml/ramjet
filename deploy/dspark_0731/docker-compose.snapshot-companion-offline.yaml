          "snapshot-client-healthcheck",
          "/run/mini-dynamo-snapshot-b/companion-b.sock",
        ]
      interval: 5s
      timeout: 2s
      retries: 3
      start_period: 10s
    labels:
      org.helixml.mini-dynamo.scope: offline-non-production
      org.helixml.mini-dynamo.engine: engine-b
      org.helixml.mini-dynamo.role: client

  snapshot-companion-offline-b:
    <<: *snapshot-companion
    container_name: snapshot-companion-offline-b
    user: "12003:12000"
    command:
      [
        "snapshot-companion-fixture",
        "--engine-id=engine-b",
        "--socket=/run/mini-dynamo-snapshot-b/companion-b.sock",
        "--secret=/run/secrets/snapshot-session-b",
        "--fixtures=/fixtures",
