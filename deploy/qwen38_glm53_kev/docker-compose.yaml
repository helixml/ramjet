name: qwen38_glm53_kev

# kev-small (0.8B, GPU 3) removed 2026-10-07: idle since it left the upstream
# list, and its 4.3 GiB co-residency capped glm53-unc-fp8's KV pool at half
# the requested 500k tokens. The kev-engine network stays attached to the LB.
#
# node06's copy carries the LB image digest and the two protected tokens as
# literals (there is no .env in that directory); everything else must match.
services:
  ds4-loadbalancer:
    image: ${LB_IMAGE:?set LB_IMAGE to an immutable tag@sha256 reference}
    container_name: ${LB_CONTAINER_NAME:-ds4-loadbalancer}
    restart: unless-stopped
    ports:
      - "127.0.0.1:${LB_API_PORT:-8006}:8000"
      - "127.0.0.1:${LB_METRICS_PORT:-8007}:9090"
      - "100.89.187.17:${LB_TAILSCALE_METRICS_PORT:-8007}:9090"
    volumes:
      - /var/lib/ramjet-machineview:/machineview
      # Minted API token hashes and the per-token usage store
      # (docs/api-tokens.md). Root-owned mode 0700 on the host.
      - /var/lib/ramjet-api:/var/lib/ramjet-api
    networks:
      - qwen-engine
      - glm-engine
      - machineview-host
      - kev-engine
    environment:
      # Stock and uncensored GLM retain distinct model ownership.
      RJ_UPSTREAM: http://glm53sm120-b:8000,http://glm53sm120-c:8000,http://glm53-unc-fp8:8000
      # Qwen compatibility alias stays on the stock GLM pool.
      RJ_MODEL_ALIASES: qwen3.8-flash-next=glm-5.3-flash
      RJ_UPSTREAM_MODELS: glm-5.3-flash,glm-5.3-flash,glm-5.3-flash-uncensored
      RJ_UPSTREAM_APIS: openai,openai,openai
      # Also the client master token: the same bearer Caddy used to check, so
      # no client changes when Ramjet takes over authentication.
      RJ_UPSTREAM_TOKEN: ${VLLM_API_KEY:?set VLLM_API_KEY in protected mode-0600 .env}
      RJ_UI_AUTH_TOKEN: ${RJ_UI_AUTH_TOKEN:?set RJ_UI_AUTH_TOKEN in protected mode-0600 .env}
      # Ramjet is the API authority: the master token or a minted rjk_* token,
      # anything else is answered 401 here. The engines do not check keys, so
      # never set this off while Caddy passes requests through unchecked.
      RJ_API_TOKENS_MODE: ${RJ_API_TOKENS_MODE:-on}
      RJ_API_STATE_DIR: /var/lib/ramjet-api
      RJ_ADVERTISE_CTX_MARGIN: "8192"
      RJ_MAX_TOKENS_STRIP: "0"
      RJ_AFFINITY: prefix
      RJ_ROUTE_ALPHA: "4"
      RJ_ROUTE_CHUNK_BYTES: "2048"
      RJ_ROUTE_MAX_PREFIX_BYTES: "2097152"
      RJ_ROUTE_MAX_OVERLAP_BLOCKS: "32"
      RJ_ROUTE_LOAD_UNIT_BYTES: "32768"
      RJ_ROUTE_MAX_LOAD_UNITS: "8"
      RJ_ROUTE_PHASE_AWARE_LOAD: "true"
      RJ_ROUTE_DECODE_LOAD_UNIT_TOKENS: "256"
      RJ_ROUTE_DECODE_MAX_LOAD_UNITS: "4"
      RJ_ROUTE_PROJECTED_LOAD: "false"
      RJ_ROUTE_SPECULATION_MODE: "off"
      RJ_ROUTE_PREFIX_SINGLE_FLIGHT_MODE: "off"
      RJ_ROUTE_AFFINITY_HORIZON_MODE: "off"
      # Long-prompt lane, off by default. With a positive byte threshold
      # (600000 is ~150k tokens) long requests route only to glm53sm120-c.
      # Measured 2026-09-26: two concurrent ~290k-token conversations do not
      # fit c's 500k-token KV pool together, so the lane made both re-read
      # half their prompt every turn (23-30s instead of ~4s) and evicted every
      # other session on c. The per-path snapshot cap already stops one long
      # prompt from evicting other sessions, so ordinary routing wins.
      RJ_ROUTE_LONG_PROMPT_BYTES: "${RJ_ROUTE_LONG_PROMPT_BYTES:-0}"
      RJ_ROUTE_LONG_PROMPT_UPSTREAMS: "${RJ_ROUTE_LONG_PROMPT_UPSTREAMS:--,lane,-}"
      RJ_ROUTE_JOURNAL: "true"
      RJ_TOKENIZER_MODE: "off"
      RJ_EXACT_ROUTE_MODE: "off"
      RJ_KV_EVENT_MODE: "off"
      RJ_SNAPSHOT_ROUTE_MODE: "off"
      RJ_UPSTREAM_ADMISSION_MODE: http
      RJ_UPSTREAM_WARMUP_MODE: enforce
      RJ_UPSTREAM_WARMUP_CONSECUTIVE_SUCCESSES: "3"
      RJ_UPSTREAM_WARMUP_STABLE_SECONDS: "30"
      RJ_IDLE_DRAIN_MODE: "off"
      RJ_MACHINEVIEW_AGENT_URL: http://172.19.0.1:8016/sample
      RJ_MACHINEVIEW_STATE_PATH: /machineview/state.json

networks:
  qwen-engine:
    external: true
    name: qwen38_flash_next_default
  glm-engine:
    external: true
    name: glm53_flash_sm120_default
  machineview-host:
    external: true
    name: qwen38_27b_default
  kev-engine:
    external: true
    name: ramjet_kev_systemone
