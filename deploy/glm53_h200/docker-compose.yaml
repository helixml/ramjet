# GLM-5.3 (753B FP8) on one 8x H200 (Hopper SM90) host.
#
# One SGLang engine owns all eight GPUs: TP8 with DP8 attention, so every GPU
# keeps its own KV pool, and a DeepEP EP8 expert all-to-all. ramjet lists each
# of the eight DP ranks as its own upstream and pins a session to the rank that
# holds its prefix.
#
#   docker compose up -d
#   python3 validate-compose.py
#
# Every tunable is a ${VAR:-default}; do not add overlay files.
name: glm53_h200

services:
  glm53:
    image: ${SGLANG_IMAGE:-lmsysorg/sglang@sha256:06e4f2ed21afde4ff513cda65070124e727ba23ccaeff7712b8c40e1097d611f}
    pull_policy: never
    container_name: glm53
    labels:
      ai.ramjet.model.repository: zai-org/GLM-5.3
      ai.ramjet.model.revision: aca966e4e02791568aa6a4ced368624b3d897f42
      ai.ramjet.runtime.release: sglang-v0.5.20
    entrypoint: ["bash", "-c"]
    command:
      - >-
        exec python3 -m sglang.launch_server
        --model-path=/models/glm53
        --served-model-name=glm-5.3
        --tp-size=8 --dp-size=8 --enable-dp-attention --ep-size=8
        --moe-a2a-backend=$$GLM_MOE_A2A_BACKEND
        --moe-runner-backend=auto
        --kv-cache-dtype=fp8_e4m3
        --dsa-prefill-backend=flashmla_sparse_q8
        --dsa-decode-backend=flashmla_kv
        --context-length=$$GLM_CONTEXT_LENGTH
        --mem-fraction-static=$$GLM_MEM_FRACTION
        --chunked-prefill-size=$$GLM_CHUNKED_PREFILL
        --max-running-requests=$$GLM_MAX_RUNNING
        --schedule-policy=hrrn
        --reasoning-parser=glm45
        --tool-call-parser=glm47
        --enable-metrics
        --enable-cache-report
        --numa-node $$GLM_NUMA_NODES
        --tokenizer-worker-num $$GLM_TOKENIZER_WORKERS
        --host=0.0.0.0 --port=8000
        $$GLM_SPEC_ARGS
        $$GLM_HICACHE_ARGS
        $$GLM_EXTRA_ARGS
    restart: "no"
    init: true
    ipc: host
    # SGLang binds each rank's CPUs and preferred memory to its GPU's NUMA node
    # only with CAP_SYS_NICE; without it the bind is silently skipped.
    cap_add: [SYS_NICE]
    shm_size: 64gb
    stop_grace_period: 120s
    ulimits:
      memlock: -1
      stack: 67108864
      nofile: {soft: 1048576, hard: 1048576}
    environment:
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      # /health otherwise generates a token through the scheduler and times out
      # ramjet's probe under load. ramjet's rank probe covers a wedged rank.
      SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: "0"
      SGLANG_UVICORN_WORKER_HEALTHCHECK_TIMEOUT: ${SGLANG_UVICORN_WORKER_HEALTHCHECK_TIMEOUT:-60}
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/torchinductor
      TILELANG_CACHE_DIR: /root/.cache/tilelang
      TRITON_CACHE_DIR: /root/.cache/triton
      CUDA_CACHE_PATH: /root/.cache/nv/ComputeCache
      SGLANG_DG_CACHE_DIR: /root/.cache/deep_gemm
      # Host NUMA node per rank (GPU i sits on node i). Rank 0 binds to node 1:
      # on this VM, GPU DMA into NUMA node 0's sub-4GiB window is misrouted
      # (Xid 94) because ACS is off on the PCIe switch ports. Node 1 then holds
      # two host KV pools, which is why HiCache is 32GB per rank.
      GLM_NUMA_NODES: ${GLM_NUMA_NODES:-1 1 2 3 4 5 6 7}
      GLM_TOKENIZER_WORKERS: ${GLM_TOKENIZER_WORKERS:-4}
      # DeepEP: +17% turns/min over the all-gather MoE path at 16 developers.
      # GLM_MOE_A2A_BACKEND=none gives a 22% larger KV pool and a lower TTFT
      # tail from 48 developers up.
      GLM_MOE_A2A_BACKEND: ${GLM_MOE_A2A_BACKEND:-deepep}
      GLM_CONTEXT_LENGTH: ${GLM_CONTEXT_LENGTH:-262144}
      GLM_MEM_FRACTION: ${GLM_MEM_FRACTION:-0.85}
      GLM_CHUNKED_PREFILL: ${GLM_CHUNKED_PREFILL:-32768}
      # Engine-wide: 16 running requests per DP rank.
      GLM_MAX_RUNNING: ${GLM_MAX_RUNNING:-128}
      GLM_SPEC_ARGS: ${GLM_SPEC_ARGS:---speculative-algorithm EAGLE --speculative-num-steps 1 --speculative-eagle-topk 1 --speculative-num-draft-tokens 2}
      # Host-memory KV tier: 2.07x turns/min at 64 developers (95.1 vs 45.9).
      GLM_HICACHE_ARGS: ${GLM_HICACHE_ARGS:---enable-hierarchical-cache --hicache-size 32 --hicache-write-policy write_through --hicache-mem-layout page_first --hicache-io-backend kernel}
      GLM_EXTRA_ARGS: ${GLM_EXTRA_ARGS:-}
    ports: ["127.0.0.1:8073:8000"]
    volumes:
      - ${MODEL_DIR:-${HOME}/models/zai-org/GLM-5.3-aca966e4}:/models/glm53:ro
      - ${CACHE_ROOT:-${HOME}/engine-cache}/sglang-glm53:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, device_ids: ["0", "1", "2", "3", "4", "5", "6", "7"], capabilities: [gpu]}

  ramjet:
    image: ${LB_IMAGE:-ghcr.io/helixml/ramjet:v0.8.0@sha256:fe432bbca183d2a457a7713fb150ea5ee36aba7a13f92280ef3ec7195ec23673}
    container_name: ramjet-glm53
    restart: unless-stopped
    ports:
      - "127.0.0.1:8006:8000"
      - "127.0.0.1:8007:9090"
    environment:
      # One upstream per DP rank of the same engine; ramjet appends
      # "routed_dp_rank" so each session stays on the rank holding its cache.
      RJ_UPSTREAM: http://glm53:8000,http://glm53:8000,http://glm53:8000,http://glm53:8000,http://glm53:8000,http://glm53:8000,http://glm53:8000,http://glm53:8000
      RJ_UPSTREAM_DP_RANKS: 0,1,2,3,4,5,6,7
      RJ_UPSTREAM_TOKEN: ${RJ_UPSTREAM_TOKEN:-glm-local}
      RJ_UPSTREAM_RANK_PROBE: ${RJ_UPSTREAM_RANK_PROBE:-on}
      RJ_ADVERTISE_CTX_MARGIN: "8192"
      RJ_MAX_TOKENS_STRIP: "0"
      RJ_AFFINITY: ${RJ_AFFINITY:-prefix}
      RJ_ROUTE_AFFINITY_BASIS: ${RJ_ROUTE_AFFINITY_BASIS:-relative}
      RJ_ROUTE_MAX_ATTEMPTS: ${RJ_ROUTE_MAX_ATTEMPTS:-3}
      RJ_ROUTE_ALPHA: ${RJ_ROUTE_ALPHA:-4}
      RJ_ROUTE_MAX_OVERLAP_BLOCKS: ${RJ_ROUTE_MAX_OVERLAP_BLOCKS:-32}
      RJ_ROUTE_PHASE_AWARE_LOAD: ${RJ_ROUTE_PHASE_AWARE_LOAD:-true}
      RJ_ROUTE_DECODE_LOAD_UNIT_TOKENS: "256"
      RJ_ROUTE_DECODE_MAX_LOAD_UNITS: "4"
      RJ_ROUTE_JOURNAL: ${RJ_ROUTE_JOURNAL:-true}
      # SGLang publishes no vLLM KV-event feed and no GLM renderer profile exists.
      RJ_TOKENIZER_MODE: "off"
      RJ_EXACT_ROUTE_MODE: "off"
      RJ_KV_EVENT_MODE: "off"
      RJ_SNAPSHOT_ROUTE_MODE: "off"
      RJ_UPSTREAM_ADMISSION_MODE: http
      RJ_IDLE_DRAIN_MODE: "off"
    depends_on: [glm53]
