# Isolated node06 TP2 canary for the community-qualified GLM-5.3-Flash SM120
# stack. The shared Ramjet service is deliberately absent: Qwen A remains the
# production owner while this engine is exercised directly on loopback.
name: glm53_flash_sm120

services:
  glm53sm120-b:
    image: ${SGLANG_IMAGE:-sha256:024a988fd0c0e15d80e382073c05657b2d57f52611c324599508cdb62b9debb8}
    pull_policy: never
    container_name: glm53sm120-b
    labels:
      ai.ramjet.model.repository: ormandj/GLM-5.3-Flash-W4A16-NVFP4-K32-Experts-FP8-WO
      ai.ramjet.model.revision: ee0989a944b0e213589191d7fca63af825a0741e
      ai.ramjet.runtime.repository: ormandj/sglang-glm53-flash-sm120
      ai.ramjet.runtime.revision: 386684975edf3cbce15c4b12df37908366e2aa8b
      ai.ramjet.runtime.release: v0.4.3
      ai.ramjet.runtime.base-digest: sha256:ec4243f940a179a27fea21895077efd47cd050501f99a1d2a5fecf7df2e7be71
      ai.ramjet.runtime.glm47-parser-sha256: 8ed76f9da2aa782b3e9374d00687186624fd383e98acf9ba0d6ac9759e1425d7
    entrypoint: ["sglang"]
    restart: "no"
    init: true
    ipc: host
    shm_size: 64gb
    stop_grace_period: 120s
    cpuset: "12-23,36-47"
    ulimits:
      memlock: -1
      stack: 67108864
      nofile: {soft: 1048576, hard: 1048576}
    ports:
      - "127.0.0.1:8062:8000"
    volumes:
      - ${MODEL_DIR:-/prod/models/ormandj/GLM-5.3-Flash-W4A16-NVFP4-K32-Experts-FP8-WO-ee0989a944b0}:/models/glm53-flash-w4a16-e4m3-k32:ro
      - ${SGLANG_CACHE_DIR:-/prod/engine-cache-sglang-glm53-sm120-v84-b}:/root/.cache
      - ./glm53-adaptive.json:/etc/glm53-adaptive/adaptive.json:ro
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      # Compose remaps host GPUs 4 and 5 to container ordinals 0 and 1.
      CUDA_VISIBLE_DEVICES: "0,1"
      HF_HUB_OFFLINE: "1"
      TRANSFORMERS_OFFLINE: "1"
      SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: "0"
      PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
      CUBLAS_WORKSPACE_CONFIG: ":4096:2:16:8"
      SGLANG_ENABLE_PCIE_IPC_ALLREDUCE: "1"
      SGLANG_PCIE_IPC_MAX_NUMEL: "786432"
      SGLANG_EXPERIMENTAL_DSA_KPOOL_METADATA_FUSION: "1"
      SGLANG_LM_HEAD_FP8: "1"
      TORCHINDUCTOR_CACHE_DIR: /root/.cache/torchinductor
      TILELANG_CACHE_DIR: /root/.cache/tilelang
      TRITON_CACHE_DIR: /root/.cache/triton
      CUDA_CACHE_PATH: /root/.cache/nv/ComputeCache
      SGLANG_KDA_EXTEND_BLOCK_TOKENS: "2048"
      SGLANG_BCG_RAGGED_SHAPES: "1"
      SGLANG_BCG_RAGGED_MAX_BS: "1"
      SGLANG_BCG_SEPARATE_CAPTURE_SESSIONS: "1"
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, device_ids: ["4", "5"], capabilities: [gpu]}
    command:
      - serve
      - --model-path=/models/glm53-flash-w4a16-e4m3-k32
      - --served-model-name=glm-5.3-flash
      - --tp=2
      - --enable-multimodal
      - --warmups=serving_coverage
      - --image-processor-backend=torchvision
      - --mm-preprocessing-device=cpu
      - --quantization=modelopt_mixed
      - --moe-runner-backend=flashinfer_cutlass
      - --disable-shared-experts-fusion
      - --disable-custom-all-reduce
      - --attention-backend=dsa
      - --linear-attn-backend=triton
      - --context-length=524288
      - --max-total-tokens=524288
      - --kv-cache-dtype=fp8_e4m3
      - --mem-fraction-static=0.99
      - --chunked-prefill-size=4096
      - --max-prefill-tokens=4096
      - --max-running-requests=4
      - --max-mamba-cache-size=28
      - --mamba-ssm-dtype=bfloat16
      - --cuda-graph-backend-prefill=breakable
      - --cuda-graph-bs-prefill
      - "64"
      - "128"
      - --cuda-graph-backend-decode=full
      - --cuda-graph-bs-decode
      - "1"
      - "2"
      - "3"
      - "4"
      - --dsa-prefill-backend=flashinfer_sparse_mla
      - --dsa-decode-backend=flashinfer_sparse_mla
      - --speculative-algorithm=EAGLE
      - --speculative-num-steps=5
      - --speculative-eagle-topk=1
      - --speculative-num-draft-tokens=6
      - --speculative-adaptive
      - --speculative-adaptive-config=/etc/glm53-adaptive/adaptive.json
      - --reasoning-parser=glm45
      - --tool-call-parser=glm47
      - --enable-metrics
      - --enable-cache-report
      - --host=0.0.0.0
      - --port=8000
