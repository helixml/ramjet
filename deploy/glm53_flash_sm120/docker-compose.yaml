# Independently managed node06 TP2 replicas for the community-qualified
# GLM-5.3-Flash SM120 stack. The shared Ramjet service is deliberately absent:
# any one engine can be recreated through this file while its peers serve.
#
# Four replicas since 2026-10-26: d and e took GPUs 0-3 from the idle
# uncensored TP4 replica (0 requests in the prior 6h). One replica's 500k-token
# KV pool holds only one ~300k-token agent conversation, so four concurrent
# long sessions on two replicas re-read 200-380k tokens per turn (45-112s TTFT).
name: glm53_flash_sm120

x-glm-engine: &glm-engine
  image: ${SGLANG_IMAGE:-sha256:faec1edf65b6a614b38309d3894da102f2cb41cf06d0e939476c79c21ca88c97}
  pull_policy: never
  labels:
    ai.ramjet.model.repository: ${GLM53_MODEL_REPOSITORY:-ormandj/GLM-5.3-Flash-W4A16-NVFP4-K32-Experts-FP8-WO}
    ai.ramjet.model.revision: ${GLM53_MODEL_REVISION:-ee0989a944b0e213589191d7fca63af825a0741e}
    ai.ramjet.runtime.repository: ormandj/sglang-glm53-flash-sm120
    ai.ramjet.runtime.revision: 386684975edf3cbce15c4b12df37908366e2aa8b
    ai.ramjet.runtime.release: v0.4.3
    ai.ramjet.runtime.base-digest: sha256:ec4243f940a179a27fea21895077efd47cd050501f99a1d2a5fecf7df2e7be71
    ai.ramjet.runtime.glm47-parser-sha256: 8ed76f9da2aa782b3e9374d00687186624fd383e98acf9ba0d6ac9759e1425d7
    ai.ramjet.runtime.swiglu-clamp-patch-sha256: b6bf7c99f3094c927100c0c933daa63a80ef9cffab44092f3199e2134dbfc0b9
    ai.ramjet.runtime.pcie-ipc-chunked-patch-sha256: 91c4721f27d34dc153935ca61768fbe34c2256335aa940a25442caf5ab11d71b
  entrypoint: ["sglang"]
  restart: "no"
  init: true
  ipc: host
  shm_size: 64gb
  stop_grace_period: 120s
  # NUMA node 1 (GPUs 4-7); d and e override this with node 0 (GPUs 0-3).
  cpuset: "12-23,36-47"
  ulimits:
    memlock: -1
    stack: 67108864
    nofile: {soft: 1048576, hard: 1048576}
  environment:
    CUDA_DEVICE_ORDER: PCI_BUS_ID
    # Each service sees its assigned host pair as container ordinals 0 and 1.
    CUDA_VISIBLE_DEVICES: "0,1"
    HF_HUB_OFFLINE: "1"
    TRANSFORMERS_OFFLINE: "1"
    SGLANG_ENABLE_HEALTH_ENDPOINT_GENERATION: "0"
    PYTORCH_CUDA_ALLOC_CONF: expandable_segments:True
    CUBLAS_WORKSPACE_CONFIG: ":4096:2:16:8"
    SGLANG_ENABLE_PCIE_IPC_ALLREDUCE: "1"
    SGLANG_PCIE_IPC_MAX_NUMEL: "786432"
    # Tune the IPC kernels at startup (cached under /root/.cache) and serve
    # prefill-sized all-reduces as 192-row chunks through the same workspace
    # instead of NCCL, which uses host-memory SHM between these GPUs.
    SGLANG_PCIE_IPC_TUNE: "1"
    SGLANG_PCIE_IPC_CHUNKED: "1"
    # SGLang sets NCCL_CUMEM_ENABLE=0 unless it is already set. Then NCCL's SHM
    # buffers are /dev/shm pages placed at first touch, and with node memory
    # full of page cache they land on the remote NUMA node (all-reduce ~2.5x
    # slower). cuMem places them on the GPU's node. Still used for the decode
    # logits all-gather and any collective the IPC path does not take.
    NCCL_CUMEM_ENABLE: "1"
    SGLANG_EXPERIMENTAL_DSA_KPOOL_METADATA_FUSION: "1"
    SGLANG_LM_HEAD_FP8: "1"
    TORCHINDUCTOR_CACHE_DIR: /root/.cache/torchinductor
    TILELANG_CACHE_DIR: /root/.cache/tilelang
    TRITON_CACHE_DIR: /root/.cache/triton
    CUDA_CACHE_PATH: /root/.cache/nv/ComputeCache
    SGLANG_KDA_EXTEND_BLOCK_TOKENS: "2048"
    SGLANG_BCG_RAGGED_SHAPES: "1"
    SGLANG_BCG_RAGGED_MAX_BS: "1"
    SGLANG_BCG_SEPARATE_CAPTURE_SESSIONS: "1"
  command:
    - serve
    - --model-path=/models/glm53-flash-w4a16-e4m3-k32
    - --served-model-name=glm-5.3-flash
    - --tp=2
    - --enable-multimodal
    - --warmups=serving_coverage
    - --image-processor-backend=torchvision
    - --mm-preprocessing-device=cpu
    - --quantization=${GLM53_QUANTIZATION:-modelopt_mixed}
    - --moe-runner-backend=flashinfer_cutlass
    - --disable-shared-experts-fusion
    - --disable-custom-all-reduce
    - --attention-backend=dsa
    - --linear-attn-backend=triton
    - --context-length=524288
    - --max-total-tokens=${GLM53_MAX_TOTAL_TOKENS:-500000}
    - --kv-cache-dtype=fp8_e4m3
    - --mem-fraction-static=0.99
    - --chunked-prefill-size=${GLM53_CHUNKED_PREFILL_SIZE:-6144}
    - --max-prefill-tokens=${GLM53_MAX_PREFILL_TOKENS:-6144}
    - --max-running-requests=4
    - --max-mamba-cache-size=28
    - --mamba-ssm-dtype=bfloat16
    # Each prefill chunk checkpoints a linear-attention state into the radix
    # cache, and the 28-slot pool evicts LRU. Without a per-path cap one
    # 310k-token prompt (~51 chunks) evicted every other session's prefix.
    - --mamba-max-states-per-path=${GLM53_MAMBA_MAX_STATES_PER_PATH:-2}
    # Host tier for evicted prefixes (KV and linear-attention states), per TP rank.
    - --enable-hierarchical-cache
    - --hicache-size=${GLM53_HICACHE_SIZE_GB:-4}
    - --cuda-graph-backend-prefill=breakable
    - --cuda-graph-bs-prefill
    - "64"
    - "128"
    - --cuda-graph-backend-decode=full
    - --cuda-graph-bs-decode
    - "1"
    - "2"
    - "3"
    - "4"
    - --dsa-prefill-backend=flashinfer_sparse_mla
    - --dsa-decode-backend=flashinfer_sparse_mla
    - --speculative-algorithm=EAGLE
    - --speculative-num-steps=5
    - --speculative-eagle-topk=1
    - --speculative-num-draft-tokens=6
    - --speculative-adaptive
    - --speculative-adaptive-config=/etc/glm53-adaptive/adaptive.json
    - --reasoning-parser=glm45
    - --tool-call-parser=glm47
    - --enable-metrics
    - --enable-cache-report
    - --host=0.0.0.0
    - --port=8000

services:
  glm53sm120-b:
    <<: *glm-engine
    container_name: glm53sm120-b
    ports:
      - "127.0.0.1:8062:8000"
    volumes:
      - ${MODEL_DIR:-/prod/models/ormandj/GLM-5.3-Flash-W4A16-NVFP4-K32-Experts-FP8-WO-ee0989a944b0}:/models/glm53-flash-w4a16-e4m3-k32:ro
      - ${SGLANG_CACHE_DIR:-/prod/engine-cache-sglang-glm53-sm120-v84-b}:/root/.cache
      - ./glm53-adaptive.json:/etc/glm53-adaptive/adaptive.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, device_ids: ["4", "5"], capabilities: [gpu]}

  glm53sm120-c:
    <<: *glm-engine
    container_name: glm53sm120-c
    ports:
      - "127.0.0.1:8063:8000"
    volumes:
      - ${MODEL_DIR:-/prod/models/ormandj/GLM-5.3-Flash-W4A16-NVFP4-K32-Experts-FP8-WO-ee0989a944b0}:/models/glm53-flash-w4a16-e4m3-k32:ro
      - ${SGLANG_CACHE_DIR_C:-/prod/engine-cache-sglang-glm53-sm120-v84-c}:/root/.cache
      - ./glm53-adaptive.json:/etc/glm53-adaptive/adaptive.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, device_ids: ["6", "7"], capabilities: [gpu]}

  glm53sm120-d:
    <<: *glm-engine
    container_name: glm53sm120-d
    cpuset: "0-11,24-35"
    ports:
      - "127.0.0.1:8065:8000"
    volumes:
      - ${MODEL_DIR:-/prod/models/ormandj/GLM-5.3-Flash-W4A16-NVFP4-K32-Experts-FP8-WO-ee0989a944b0}:/models/glm53-flash-w4a16-e4m3-k32:ro
      - ${SGLANG_CACHE_DIR_D:-/prod/engine-cache-sglang-glm53-sm120-v84-d}:/root/.cache
      - ./glm53-adaptive.json:/etc/glm53-adaptive/adaptive.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, device_ids: ["0", "1"], capabilities: [gpu]}

  glm53sm120-e:
    <<: *glm-engine
    container_name: glm53sm120-e
    cpuset: "0-11,24-35"
    ports:
      - "127.0.0.1:8066:8000"
    volumes:
      - ${MODEL_DIR:-/prod/models/ormandj/GLM-5.3-Flash-W4A16-NVFP4-K32-Experts-FP8-WO-ee0989a944b0}:/models/glm53-flash-w4a16-e4m3-k32:ro
      - ${SGLANG_CACHE_DIR_E:-/prod/engine-cache-sglang-glm53-sm120-v84-e}:/root/.cache
      - ./glm53-adaptive.json:/etc/glm53-adaptive/adaptive.json:ro
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, device_ids: ["2", "3"], capabilities: [gpu]}
