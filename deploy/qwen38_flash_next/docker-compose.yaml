# Canonical source: helixml/ramjet/deploy/qwen38_flash_next/docker-compose.yaml
#
# Qwen3.8-Flash-Next-FP8 on 8x RTX PRO 6000 Blackwell (SM120): two NUMA-local
# TP4 vLLM engines behind ramjet. This is the whole deployment; do not add an
# overlay. During qualification, start only the explicitly named canary engine.

x-vllm-labels: &vllm-labels
  ai.ramjet.model.repository: Qwen/Qwen3.8-Flash-Next-FP8
  ai.ramjet.model.revision: bcd9f01ddc9cff2316eb84281bebcd5b058bddce

x-vllm-engine: &vllm-engine
  image: ${VLLM_IMAGE:-vllm/vllm-openai@sha256:0aea30240f3e3d9ffae8526643950e170eb5fa07fc427016a9dd90892afa2aa3}
  labels: *vllm-labels
  entrypoint: ["vllm", "serve"]
  restart: ${ENGINE_RESTART_POLICY:-unless-stopped}
  ipc: host
  init: true
  shm_size: 32gb
  ulimits:
    memlock: -1
    stack: 67108864
    nofile: {soft: 1048576, hard: 1048576}
  volumes:
    - ${MODEL_DIR:-/prod/models/Qwen/Qwen3.8-Flash-Next-FP8-bcd9f01ddc9c}:/workspace/model:ro
    - ${VLLM_CACHE_DIR:-/prod/engine-cache-vllm-qwen38flashnext}:/root/.cache
  environment:
    CUDA_DEVICE_ORDER: PCI_BUS_ID
    CUDA_VISIBLE_DEVICES: "0,1,2,3"
    # vLLM reads this directly. Keep bearer authority out of the process argv
    # so identity capture and host process inspection remain privacy-safe.
    VLLM_API_KEY: ${VLLM_API_KEY:-qwen-local}
    # Host RAM is constrained on node06. Keep the 51B N-gram table on the
    # GPUs for the first qualification; CPU PLE offload is a later A/B only.
    VLLM_PLE_CPU_OFFLOAD: "0"
services:
  ds4-loadbalancer:
    image: ${LB_IMAGE:-ghcr.io/helixml/ramjet:v0.4.0@sha256:467e7edf40c8fcad29e741cbba52ca571cbae0261d94cff008aa6bcdb737ea1b}
    container_name: ds4-loadbalancer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8006:8000"
      - "127.0.0.1:8007:9090"
      - "100.89.187.17:8007:9090"
    volumes:
      - /var/lib/ramjet-machineview:/machineview
      - /var/lib/ramjet-adaptive:/var/lib/ramjet-adaptive
      - /var/run/docker.sock:/var/run/docker.sock
      - /run/lock/ramjet-node06-deployment.lock:/run/lock/ramjet-node06-deployment.lock
      - ${ADAPTIVE_CONFIG_PATH:-./adaptive-config.json}:/etc/ramjet/adaptive-config.json:ro
      - ${MODEL_DIR:-/prod/models/Qwen/Qwen3.8-Flash-Next-FP8-bcd9f01ddc9c}/tokenizer.json:/models/qwen38-flash-next/tokenizer.json:ro
      - ${MODEL_DIR:-/prod/models/Qwen/Qwen3.8-Flash-Next-FP8-bcd9f01ddc9c}/tokenizer_config.json:/models/qwen38-flash-next/tokenizer_config.json:ro
    # The host telemetry agent is intentionally bound only to the established
    # node06 bridge gateway. Retain that observation-only path when Compose
    # ownership moves from the old Qwen stack to this deployment.
    networks:
      - default
      - machineview-host
    environment:
      RJ_UPSTREAM: ${RJ_UPSTREAM:-http://qwen38flashnext-a:8000,http://qwen38flashnext-b:8000,http://qwen38flashnext-tp8:8000}
      RJ_UPSTREAM_TOKEN: ${VLLM_API_KEY:-qwen-local}
      # Dedicated dashboard/control credential. It must not reuse the engine
      # bearer because the browser and serving plane have different authority.
      RJ_UI_AUTH_TOKEN: ${RJ_UI_AUTH_TOKEN:?set RJ_UI_AUTH_TOKEN in protected mode-0600 .env}
      RJ_ADVERTISE_CTX_MARGIN: ${RJ_ADVERTISE_CTX_MARGIN:-8192}
      # Flash-Next admits valid six-figure output budgets. Preserve the
      # caller's limit instead of applying ramjet's legacy 100K sentinel shim.
      RJ_MAX_TOKENS_STRIP: "0"
      RJ_AFFINITY: ${RJ_AFFINITY:-prefix}
      RJ_ROUTE_ALPHA: ${RJ_ROUTE_ALPHA:-4}
      RJ_ROUTE_CHUNK_BYTES: ${RJ_ROUTE_CHUNK_BYTES:-2048}
      RJ_ROUTE_MAX_PREFIX_BYTES: ${RJ_ROUTE_MAX_PREFIX_BYTES:-2097152}
      RJ_ROUTE_MAX_OVERLAP_BLOCKS: ${RJ_ROUTE_MAX_OVERLAP_BLOCKS:-32}
      RJ_ROUTE_LOAD_UNIT_BYTES: ${RJ_ROUTE_LOAD_UNIT_BYTES:-32768}
      RJ_ROUTE_MAX_LOAD_UNITS: ${RJ_ROUTE_MAX_LOAD_UNITS:-8}
      RJ_ROUTE_PHASE_AWARE_LOAD: ${RJ_ROUTE_PHASE_AWARE_LOAD:-true}
      # Reserve bounded decode work after first token instead of treating every
      # active decode as one equal unit. Zero is the instant rollback.
      RJ_ROUTE_DECODE_LOAD_UNIT_TOKENS: ${RJ_ROUTE_DECODE_LOAD_UNIT_TOKENS:-256}
      RJ_ROUTE_DECODE_MAX_LOAD_UNITS: ${RJ_ROUTE_DECODE_MAX_LOAD_UNITS:-4}
      # Default-off candidate: qualify warm long-prefix placement against
      # stale-locality and MTP throughput guards before enabling it.
      RJ_ROUTE_PROJECTED_LOAD: ${RJ_ROUTE_PROJECTED_LOAD:-false}
      # A retains the qualified MTP3 profile; B is the standard long-output
      # profile. Profile preference is only the final routing score tie-break.
      RJ_ROUTE_SPECULATION_MODE: ${RJ_ROUTE_SPECULATION_MODE:-prefer}
      RJ_ROUTE_SPECULATION_PROFILES: ${RJ_ROUTE_SPECULATION_PROFILES:-mtp,standard,mtp}
      # Coalesce concurrent cold requests with at least 16KiB of common prefix.
      # The bounded table and load delta both fail open to ordinary routing.
      RJ_ROUTE_PREFIX_SINGLE_FLIGHT_MODE: ${RJ_ROUTE_PREFIX_SINGLE_FLIGHT_MODE:-prefer}
      RJ_ROUTE_PREFIX_SINGLE_FLIGHT_MIN_BLOCKS: ${RJ_ROUTE_PREFIX_SINGLE_FLIGHT_MIN_BLOCKS:-8}
      RJ_ROUTE_PREFIX_SINGLE_FLIGHT_CAPACITY: ${RJ_ROUTE_PREFIX_SINGLE_FLIGHT_CAPACITY:-1024}
      RJ_ROUTE_PREFIX_SINGLE_FLIGHT_MAX_LOAD_DELTA: ${RJ_ROUTE_PREFIX_SINGLE_FLIGHT_MAX_LOAD_DELTA:-1}
      RJ_ROUTE_JOURNAL: ${RJ_ROUTE_JOURNAL:-true}
      RJ_TOKENIZER_MODE: local-shadow
      RJ_TOKENIZER_PROFILE: qwen3.8-flash-next
      RJ_TOKENIZER_PATH: /models/qwen38-flash-next/tokenizer.json
      RJ_TOKENIZER_SHA256: 0997f410c57a1f4e53b09e4be8f4a172d90edd9564368fb0847030937229b9f3
      RJ_CHAT_TEMPLATE_PATH: /models/qwen38-flash-next/tokenizer_config.json
      RJ_CHAT_TEMPLATE_SHA256: b11349aafa7cdc6a320767cf7ceb29ed82f7eda5d65e8e0819e76f0ce947bf27
      RJ_EXACT_ROUTE_MODE: placement
      RJ_EXACT_ROUTE_MANIFEST_PATH: /compat/qwen38-flash-next-r134.json
      RJ_EXACT_ROUTE_MANIFEST_SHA256: a5efb2db66475b8a7c4f01bbb5d47b62387f251354bdebd2641b1f2d00a64a67
      RJ_EXACT_ROUTE_MIN_GAIN_TOKENS: ${RJ_EXACT_ROUTE_MIN_GAIN_TOKENS:-8192}
      RJ_EXACT_ROUTE_MAX_LOAD_DELTA: ${RJ_EXACT_ROUTE_MAX_LOAD_DELTA:-0}
      # Exact placement passed the 1%, 10%, and 100% live rollout gates. Keep
      # the qualified full cohort as the deployment default and require its
      # independent key from the protected mode-0600 .env. An explicit zero
      # remains the instant behavior rollback.
      RJ_EXACT_ROUTE_CANARY_BPS: ${RJ_EXACT_ROUTE_CANARY_BPS:-10000}
      RJ_EXACT_ROUTE_CANARY_KEY: ${RJ_EXACT_ROUTE_CANARY_KEY:?set RJ_EXACT_ROUTE_CANARY_KEY in protected mode-0600 .env}
      RJ_UPSTREAM_ADMISSION_MODE: http
      # After a replica has failed readiness, require three successful probes
      # spanning 30 seconds before it can rejoin placement. No synthetic probe
      # is generated; this reuses the ordinary HTTP readiness loop.
      RJ_UPSTREAM_WARMUP_MODE: ${RJ_UPSTREAM_WARMUP_MODE:-enforce}
      RJ_UPSTREAM_WARMUP_CONSECUTIVE_SUCCESSES: ${RJ_UPSTREAM_WARMUP_CONSECUTIVE_SUCCESSES:-3}
      RJ_UPSTREAM_WARMUP_STABLE_SECONDS: ${RJ_UPSTREAM_WARMUP_STABLE_SECONDS:-30}
      RJ_KV_EVENT_MODE: shadow
      RJ_KV_EVENT_LIVE_ENDPOINTS: tcp://qwen38flashnext-a:5557,tcp://qwen38flashnext-b:5557,tcp://qwen38flashnext-tp8:5557
      RJ_KV_EVENT_REPLAY_ENDPOINTS: tcp://qwen38flashnext-a:5558,tcp://qwen38flashnext-b:5558,tcp://qwen38flashnext-tp8:5558
      RJ_ADAPTIVE_CONFIG_PATH: /etc/ramjet/adaptive-config.json
      RJ_MACHINEVIEW_AGENT_URL: http://172.19.0.1:8016/sample
      RJ_MACHINEVIEW_STATE_PATH: /machineview/state.json
      RJ_IDLE_DRAIN_MODE: ${RJ_IDLE_DRAIN_MODE:-observe}
      RJ_IDLE_DRAIN_RELEASE: ${RJ_IDLE_DRAIN_RELEASE:-fleet-idle}
      RJ_IDLE_DRAIN_UPSTREAM_IDLE_AFTER_SECONDS: ${RJ_IDLE_DRAIN_UPSTREAM_IDLE_AFTER_SECONDS:-600}
      RJ_IDLE_DRAIN_RESUME_LOAD_PER_REPLICA: ${RJ_IDLE_DRAIN_RESUME_LOAD_PER_REPLICA:-4}
      RJ_IDLE_DRAIN_IDLE_AFTER_SECONDS: "900"
      RJ_IDLE_DRAIN_MIN_WARM: "1"
      RJ_IDLE_DRAIN_COOLDOWN_SECONDS: "300"
      RJ_IDLE_DRAIN_GRACE_SECONDS: "30"
      RJ_IDLE_DRAIN_INTERVAL_SECONDS: "15"

  qwen38flashnext-a:
    <<: *vllm-engine
    container_name: qwen38flashnext-a
    labels:
      <<: *vllm-labels
      com.helixml.ramjet.adaptive-profile: split-tp4
      com.helixml.ramjet.adaptive-upstream: "0"
    cpuset: "0-11,24-35"
    ports: ["127.0.0.1:8040:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, device_ids: ["0", "1", "2", "3"], capabilities: [gpu]}
    command: &vllm-command-mtp
      - /workspace/model
      - --served-model-name=${SERVED_MODEL_NAME:-qwen3.8-flash-next}
      - --revision=bcd9f01ddc9cff2316eb84281bebcd5b058bddce
      - --tokenizer-revision=bcd9f01ddc9cff2316eb84281bebcd5b058bddce
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=4
      - --enable-expert-parallel
      - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.90}
      - --kv-cache-memory=${KV_CACHE_MEMORY:-40190174004}
      - --max-model-len=${MAX_MODEL_LEN:-262144}
      - --max-num-seqs=${MAX_NUM_SEQS:-64}
      - --max-num-batched-tokens=${MAX_NUM_BATCHED_TOKENS:-8192}
      - --speculative-config={"method":"mtp","num_speculative_tokens":3,"index_share_for_mtp_iteration":true}
      - --kv-events-config={"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","replay_endpoint":"tcp://*:5558","buffer_steps":10000,"hwm":100000,"max_queue_size":100000,"topic":""}
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --no-enable-flashinfer-autotune
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=qwen3

  qwen38flashnext-b:
    <<: *vllm-engine
    container_name: qwen38flashnext-b
    labels:
      <<: *vllm-labels
      com.helixml.ramjet.adaptive-profile: split-tp4
      com.helixml.ramjet.adaptive-upstream: "1"
    cpuset: "12-23,36-47"
    ports: ["127.0.0.1:8041:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, device_ids: ["4", "5", "6", "7"], capabilities: [gpu]}
    # Standard decoding is the qualified long-output counterpart to A's MTP3
    # profile. Keep every other serving argument byte-identical.
    command:
      - /workspace/model
      - --served-model-name=${SERVED_MODEL_NAME:-qwen3.8-flash-next}
      - --revision=bcd9f01ddc9cff2316eb84281bebcd5b058bddce
      - --tokenizer-revision=bcd9f01ddc9cff2316eb84281bebcd5b058bddce
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=4
      - --enable-expert-parallel
      - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.90}
      - --kv-cache-memory=${KV_CACHE_MEMORY:-40190174004}
      - --max-model-len=${MAX_MODEL_LEN:-262144}
      - --max-num-seqs=${MAX_NUM_SEQS:-64}
      - --max-num-batched-tokens=${MAX_NUM_BATCHED_TOKENS:-8192}
      - --kv-events-config={"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","replay_endpoint":"tcp://*:5558","buffer_steps":10000,"hwm":100000,"max_queue_size":100000,"topic":""}
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --no-enable-flashinfer-autotune
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=qwen3

  # Created during deployment but left stopped. The embedded controller is the
  # only runtime owner allowed to start it, after both TP4 engines are drained
  # and stopped. The profile prevents an ordinary `docker compose up` from
  # claiming all eight GPUs behind the controller's back.
  qwen38flashnext-tp8:
    <<: *vllm-engine
    profiles: [adaptive]
    container_name: qwen38flashnext-tp8
    labels:
      <<: *vllm-labels
      com.helixml.ramjet.adaptive-profile: unified-tp8
      com.helixml.ramjet.adaptive-upstream: "2"
    cpuset: "0-47"
    ports: ["127.0.0.1:8042:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, device_ids: ["0", "1", "2", "3", "4", "5", "6", "7"], capabilities: [gpu]}
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      CUDA_VISIBLE_DEVICES: "0,1,2,3,4,5,6,7"
      VLLM_API_KEY: ${VLLM_API_KEY:-qwen-local}
      VLLM_PLE_CPU_OFFLOAD: "0"
    command:
      - /workspace/model
      - --served-model-name=${SERVED_MODEL_NAME:-qwen3.8-flash-next}
      - --revision=bcd9f01ddc9cff2316eb84281bebcd5b058bddce
      - --tokenizer-revision=bcd9f01ddc9cff2316eb84281bebcd5b058bddce
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=8
      - --enable-expert-parallel
      - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.90}
      - --kv-cache-memory=${KV_CACHE_MEMORY:-40190174004}
      - --max-model-len=${MAX_MODEL_LEN:-262144}
      - --max-num-seqs=${MAX_NUM_SEQS:-64}
      - --max-num-batched-tokens=${MAX_NUM_BATCHED_TOKENS:-8192}
      - --speculative-config={"method":"mtp","num_speculative_tokens":3,"index_share_for_mtp_iteration":true}
      - --kv-events-config={"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","replay_endpoint":"tcp://*:5558","buffer_steps":10000,"hwm":100000,"max_queue_size":100000,"topic":""}
      - --enable-prefix-caching
      - --enable-prompt-tokens-details
      - --no-enable-flashinfer-autotune
      - --enable-auto-tool-choice
      - --tool-call-parser=qwen3_coder
      - --reasoning-parser=qwen3

networks:
  machineview-host:
    external: true
    name: ${MACHINEVIEW_NETWORK:-qwen38_27b_default}
