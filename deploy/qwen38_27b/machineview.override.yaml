# Canonical source: helixml/ramjet/deploy/qwen38_27b/machineview.override.yaml
#
# node06 publishes the observation-only machine view on its Tailscale address.
# The host agent remains loopback-only; the LB reaches it through this Compose
# project's bridge gateway and persists the bounded dashboard history locally.
services:
  ds4-loadbalancer:
    ports:
      - "100.89.187.17:8007:9090"
    volumes:
      - /var/lib/ramjet-machineview:/machineview
    environment:
      RJ_MACHINEVIEW_AGENT_URL: http://172.19.0.1:8016/sample
      RJ_MACHINEVIEW_STATE_PATH: /machineview/state.json
