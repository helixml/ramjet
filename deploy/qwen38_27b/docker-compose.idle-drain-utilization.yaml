# Release individually quiet replicas while the fleet keeps serving.
#
# Why this exists. On 2026-08-19 node06 was measured with all production
# traffic on qwen38-e3 at concurrency 2, while GPUs 0-5 sat at 0% utilization
# drawing 98-108W each: about 620W continuous, roughly 15 kWh/day, to do
# nothing. The cause is the prefix router correctly co-locating one shared
# system prompt. Fleet-idle release cannot recover any of it, because e3 is
# never quiet — the measured longest gap was 20 seconds against a 900-second
# window.
#
# What changes. RJ_IDLE_DRAIN_RELEASE=utilization releases a replica that has
# been individually quiet, rather than waiting for the whole deployment to go
# quiet. Resume stops keying on request arrival, which is meaningless when
# requests never stop, and keys on load pressure instead.
#
# This is a real trade, unlike fleet-idle release:
#
#   * Burst headroom. A burst arrives to fewer engines and waits for a wake.
#     RJ_IDLE_DRAIN_RESUME_LOAD_PER_REPLICA sets how much mean in-flight work
#     per serving replica is tolerated before everything comes back. Read
#     ramjet_idle_drain_load_per_replica for a week before tuning it; the
#     observed value on this workload is 1-2.
#   * Cache residency. Sleeping discards the replica's KV cache. A session
#     that returns to a parked replica re-prefills. The quiet window is
#     floored at 60s and defaulted to 300s for this reason: a replica between
#     two turns of one conversation is waiting, not idle.
#
# Host memory decides how far this can go, and it is worse than it looks.
# Measured on 2026-08-20: level-1 sleep on one Qwen3.8-27B TP2 engine freed
# 87,890MiB of VRAM per GPU in 23.2s and woke in 894ms, but took about 38GiB of
# host memory and DID NOT RETURN IT ON WAKE. Available memory stayed at 4.5GiB
# with the engine awake and serving; only stopping the container recovered it.
#
# So the cap does not bound concurrent parks, it bounds how many replicas may
# ever park during a container's lifetime. One is the right number here.
# Raising it is not a question of affording one more simultaneous park but of
# affording another 38GiB permanently. Re-measure before changing it.
#
# Render on the sleep-mode topology, whose engines carry --enable-sleep-mode:
#
#   docker compose -f docker-compose.yaml \
#     -f topology.8gpu-tp2.sleep.yaml \
#     -f machineview.override.yaml \
#     -f docker-compose.idle-drain-utilization.yaml up -d
#
# Qualify in observe first. Observe advances this same state machine and
# publishes the same intent while fencing nothing and calling nothing, so the
# release decisions can be read off ramjet_idle_drain_state with no serving
# consequence.
services:
  ds4-loadbalancer:
    environment:
      RJ_IDLE_DRAIN_MODE: drain
      RJ_IDLE_DRAIN_RELEASE: utilization
      RJ_IDLE_DRAIN_ACTUATOR: sleep
      RJ_IDLE_DRAIN_SLEEP_LEVEL: "1"
      # Host RAM, not replica count. See the note above before raising.
      RJ_IDLE_DRAIN_MAX_PARKED: "1"
      # How long one replica must be at zero inflight to be released.
      RJ_IDLE_DRAIN_UPSTREAM_IDLE_AFTER_SECONDS: "600"
      # Mean in-flight per serving replica that resumes the whole fleet. Also
      # the anti-flap bound: a release that would immediately reach this is
      # refused, so the policy cannot park and wake in a loop.
      RJ_IDLE_DRAIN_RESUME_LOAD_PER_REPLICA: "4"
      RJ_IDLE_DRAIN_MIN_WARM: "1"
      RJ_IDLE_DRAIN_COOLDOWN_SECONDS: "300"
      RJ_IDLE_DRAIN_GRACE_SECONDS: "30"
      RJ_IDLE_DRAIN_INTERVAL_SECONDS: "15"
      # Retained but inert under utilization release.
      RJ_IDLE_DRAIN_IDLE_AFTER_SECONDS: "900"
