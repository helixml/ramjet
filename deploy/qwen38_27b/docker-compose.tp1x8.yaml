# TP1 data-parallel overlay: eight independent single-GPU engines.
#
# Qwen3.8-27B-FP8 is ~28GB of weights and each RTX PRO 6000 Blackwell has 96GB,
# so the model fits on one card with room for KV cache. Running eight
# independent engines removes every NCCL allreduce from the decode path, which
# for a model this size is usually worth more than any scheduler tuning. The
# load balancer already fronts N upstreams, which is the whole point of it.
#
# Measured 2026-08-14: 8412 tok/s at c256 against the TP4 pair's ~7800, +8%,
# with TTFT p50 of 0.265s. c512 reached 12,948 tok/s before the stack shed all
# traffic (see below).
#
# This is NOT the production default, for two reasons that outweigh +8%:
#
#  1. Prefix locality. Eight engines mean eight separate 818,471-token KV
#     pools, so a shared system prompt is resident on one engine in eight
#     rather than one in two. Helix agent traffic is exactly the shared-prefix
#     workload that penalises, and the synthetic sweep behind the +8% uses
#     unique prompts, so it cannot see that cost.
#  2. At c512 the load balancer marked every upstream down and returned 503 to
#     all 512 requests in 0.3s, while all eight engines were in fact alive and
#     recovered immediately afterwards. Saturated engines starve the health
#     probe, and the balancer has no fail-open path.
#
# Use this for throughput-bound workloads with unique prompts. For shared
# prefixes or long context, use the base TP4 file.
#
# Use with the base file:
#   docker compose -f docker-compose.yaml -f docker-compose.tp1x8.yaml up -d
services:
  ds4-loadbalancer:
    environment:
      MD_UPSTREAM: ${MD_UPSTREAM:-http://qwen38-d0:8000,http://qwen38-d1:8000,http://qwen38-d2:8000,http://qwen38-d3:8000,http://qwen38-d4:8000,http://qwen38-d5:8000,http://qwen38-d6:8000,http://qwen38-d7:8000}
      MD_KV_EVENT_LIVE_ENDPOINTS: ${MD_KV_EVENT_LIVE_ENDPOINTS:-tcp://qwen38-d0:5557,tcp://qwen38-d1:5557,tcp://qwen38-d2:5557,tcp://qwen38-d3:5557,tcp://qwen38-d4:5557,tcp://qwen38-d5:5557,tcp://qwen38-d6:5557,tcp://qwen38-d7:5557}
      MD_KV_EVENT_REPLAY_ENDPOINTS: ${MD_KV_EVENT_REPLAY_ENDPOINTS:-tcp://qwen38-d0:5558,tcp://qwen38-d1:5558,tcp://qwen38-d2:5558,tcp://qwen38-d3:5558,tcp://qwen38-d4:5558,tcp://qwen38-d5:5558,tcp://qwen38-d6:5558,tcp://qwen38-d7:5558}
  # The base file's TP4 pair is collapsed onto single GPUs so that a stale
  # container cannot hold four cards while the eight-way fleet starts.
  qwen38-a:
    profiles: ["tp4-only"]
  qwen38-b:
    profiles: ["tp4-only"]
  qwen38-d0:
    image: ${IMAGE:-voipmonitor/vllm:gilded-gnosis-v20-vllm4d006a4-b12xcd3ce19-fi1ac6942-cu132-20260810-r34}
    container_name: qwen38-d0
    entrypoint: ["/opt/venv/bin/vllm", "serve", "/workspace/model"]
    restart: unless-stopped
    ipc: host
    init: true
    shm_size: 8gb
    cpuset: "0-11,24-35"
    ulimits:
      memlock: -1
      stack: 67108864
      nofile: {soft: 1048576, hard: 1048576}
    ports:
      - "127.0.0.1:8020:8000"
    volumes:
      - ${QWEN_MODEL_DIR:-/prod/models/Qwen/Qwen3.8-27B-FP8}:/workspace/model:ro
      - /prod/engine-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0"]
              capabilities: [gpu]
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      VLLM_API_KEY: ${VLLM_API_KEY:-qwen-local}
    command:
      - --served-model-name=${SERVED_MODEL_NAME:-qwen3.8-27b}
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=1
      # 65536 is what was measured, and it advertised only 57344 usable
      # context against the TP4 pair's 253952. There is no throughput reason
      # for the cap -- the 818,471-token pool per engine bounds concurrency,
      # not request length -- so the default is raised to match the base file.
      # Re-measure before trusting it: the recorded numbers were taken at
      # 65536.
      - --max-model-len=${TP1_MAX_MODEL_LEN:-262144}
      - --max-num-seqs=${MAX_NUM_SEQS:-256}
      - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.90}
      - --enable-prefix-caching
      - --reasoning-parser=qwen3
      - --tool-call-parser=${TOOL_CALL_PARSER:-qwen3_xml}
      - --enable-auto-tool-choice
      - --limit-mm-per-prompt={"image":${MM_IMAGE_LIMIT:-4},"video":${MM_VIDEO_LIMIT:-1}}
      - --kv-events-config={"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","replay_endpoint":"tcp://*:5558","buffer_steps":10000,"hwm":100000,"max_queue_size":100000,"topic":""}
      - --override-generation-config={"top_p":0.95}

