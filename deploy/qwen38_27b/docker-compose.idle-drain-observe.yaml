# Observation overlay for the idle-drain policy on the qwen38 topology.
#
# This evaluates the policy against real traffic and publishes what it *would*
# park, but withholds nothing from routing and calls nothing on an engine. It
# is the qualification step before docker-compose.idle-drain-sleep.yaml.
#
# Observe is consequence-free by construction, not by configuration: the
# binary refuses to actuate outside drain mode, so RJ_IDLE_DRAIN_ACTUATOR is
# inert here whatever it is set to. The engines do not need --enable-sleep-mode
# for this overlay, which is why it is an LB-only recreate.
#
# Render on top of the same file list the running LB was created from:
#
#   docker compose -f docker-compose.yaml \
#     -f topology.8gpu-tp2.yaml \
#     -f machineview.override.yaml \
#     -f docker-compose.idle-drain-observe.yaml up -d --no-deps ds4-loadbalancer
#
# What to look for before promoting:
#
#   * ramjet_idle_drain_state reaching 2 (drained) on exactly one replica
#     during a genuinely quiet window, and returning to 0 when traffic resumes.
#   * ramjet_idle_drain_safe_to_stop staying 0 throughout — observe must never
#     report it, because nothing is fenced and in-flight work is not accounted.
#   * ramjet_engine_park_state pinned at 0 (awake) on every replica. Anything
#     else in observe mode is a bug in the actuator gate.
#   * ramjet_upstream_up staying 1 on all four replicas: the drain flag is
#     separate from health, so a replica the policy released must still report
#     reachable.
services:
  ds4-loadbalancer:
    environment:
      RJ_IDLE_DRAIN_MODE: observe
      # Quiet period before the fleet counts as idle. Deliberately long: the
      # cost of parking too eagerly is a wake latency on live traffic, and the
      # cost of parking too late is a few hundred watt-minutes.
      RJ_IDLE_DRAIN_IDLE_AFTER_SECONDS: "900"
      RJ_IDLE_DRAIN_MIN_WARM: "1"
      RJ_IDLE_DRAIN_COOLDOWN_SECONDS: "300"
      RJ_IDLE_DRAIN_GRACE_SECONDS: "30"
      RJ_IDLE_DRAIN_INTERVAL_SECONDS: "15"
