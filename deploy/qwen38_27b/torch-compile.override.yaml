# torch.compile overlay for the SGLang DFlash2 topology (candidate, 2026-08-22).
#
# Apply AFTER topology.8gpu-sglang-dflash2.yaml; it restates that file's
# command anchor (Compose cannot append to a command list) plus three flags:
#
#   --enable-torch-compile --torch-compile-max-bs 8 --mem-fraction-static 0.85
#
# Measured on this hardware (EXPERIMENTS.md 2026-08-22 sweep): +12% greedy
# batch-1 decode median (149.8 -> 167.8 tok/s), +10-15% decode at 82K context
# (106-109 -> 113-121 tok/s), neutral official-sampling median and c4/c8
# aggregate. No numerics-class change (same weights, KV dtype, speculation).
#
# Operational cost and risk, measured during the sweep:
#   * Startup grows from ~90s to ~8 minutes (torch.compile), even with the
#     shared /root/.cache volume warm. Roll one engine at a time.
#   * 2 of 6 first launches failed CUDA graph capture
#     (cudaErrorStreamCaptureInvalidated) at the auto mem fraction; the
#     explicit 0.85 above succeeded on both retries and never failed first-try.
#     Watch the first capture on every roll; a crash loop here is this failure,
#     not a weights/model problem.
#
# Canary one engine before the fleet (e7 is the conventional canary):
#
#   docker compose -f docker-compose.yaml -f topology.8gpu-sglang-dflash2.yaml \
#     -f machineview.override.yaml -f docker-compose.idle-drain-observe.yaml \
#     -f torch-compile.override.yaml up -d --no-deps qwen38-sg-e7
#
# Note the full-fleet apply changes the rendered command of every engine;
# follow the render-diff discipline in AGENTS.md (the only diff should be the
# three flags on each sglang service).

x-sglang-command-compile: &sglang-command-compile
  - --model-path=/workspace/model
  - --served-model-name=${SERVED_MODEL_NAME:-qwen3.8-27b}
  - --host=0.0.0.0
  - --port=8000
  - --api-key=${VLLM_API_KEY:-qwen-local}
  - --speculative-algorithm=DFLASH
  - --speculative-draft-model-path=/workspace/draft
  - --speculative-num-draft-tokens=${DFLASH_DRAFT_TOKENS:-8}
  - --enable-cache-report
  - --reasoning-parser=qwen3
  - --tool-call-parser=${SGLANG_TOOL_CALL_PARSER:-qwen3_coder}
  - --enable-metrics
  - --enable-torch-compile
  - --torch-compile-max-bs=8
  - --mem-fraction-static=0.85

services:
  qwen38-sg-e0: {command: *sglang-command-compile}
  qwen38-sg-e1: {command: *sglang-command-compile}
  qwen38-sg-e2: {command: *sglang-command-compile}
  qwen38-sg-e3: {command: *sglang-command-compile}
  qwen38-sg-e4: {command: *sglang-command-compile}
  qwen38-sg-e5: {command: *sglang-command-compile}
  qwen38-sg-e6: {command: *sglang-command-compile}
  qwen38-sg-e7: {command: *sglang-command-compile}
