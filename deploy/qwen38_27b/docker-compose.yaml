# Canonical source: helixml/mini-dynamo/deploy/qwen38_27b/docker-compose.yaml
# Qwen3.8-27B-FP8 (vision-language) on 8x RTX PRO 6000 Blackwell (SM120), x86.
#
# Two TP4 engines behind the mini-dynamo load balancer, mirroring the
# DeepSeek-V4-Flash topology: A on GPUs 0-3 (:8012), B on GPUs 4-7 (:8013).
#
# This file is the eight-GPU default, not the only option. The topology is
# (engines x tensor-parallel size), and render_topology.py generates the
# overlay for any valid combination down to a single GPU:
#
#   ./render_topology.py --gpus 4 --tensor-parallel 2 -o topology.4gpu-tp2.yaml
#   docker compose -f docker-compose.yaml -f topology.4gpu-tp2.yaml up -d
#
# On this hardware four TP2 engines measured up to 25% better than this pair
# for shared-prefix traffic, because engines partition the prefix cache and
# tensor parallelism costs an allreduce per layer. See docs/models.md for the
# selection table and the VRAM each topology needs.
#
# Qwen3.8-27B declares architectures ["Qwen3_5ForConditionalGeneration"] and is
# already supported by the pinned r34 image, so this reuses that engine image
# rather than introducing a new one. It deliberately does NOT use the
# serve-ds4-flash.sh launcher: that wrapper is DeepSeek/DSpark-specific
# (MODE=dspark, BACKEND=b12x-a16, speculative depth). Qwen runs plain
# `vllm serve` with an explicit argv so every setting is visible here.
#
# The model is a hybrid stack -- Gated DeltaNet linear attention in three of
# every four layers, full attention in the fourth (`layer_types` in
# config.json). Prefix caching and KV-cache-event semantics under that layout
# are NOT assumed; they are measured. See EXPERIMENTS.md.
#
# FP8 weights are ~31GB total and modules_to_not_convert keeps the 27 visual
# blocks in BF16, so the vision tower is unquantized.
services:
  ds4-loadbalancer:
    # Container name is retained so existing bench scripts, the deployment
    # lock, and the Grafana ds4proxy_ dashboards keep working.
    # Override only with another immutable tag+digest pair. This pin is the
    # latest published machine-view build; its OCI revision is 59c6b1e.
    image: ${LB_IMAGE:-ghcr.io/helixml/mini-dynamo:rust-59c6b1e@sha256:2c726118bfd25bb62857808c3b2814ab0e5d31ed4be20e84813a02704f09c401}
    container_name: ds4-loadbalancer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8006:8000"
      - "127.0.0.1:8007:9090"
    environment:
      MD_UPSTREAM: ${MD_UPSTREAM:-http://qwen38-a:8000,http://qwen38-b:8000}
      MD_UPSTREAM_TOKEN: ${VLLM_API_KEY:-qwen-local}
      MD_ADVERTISE_CTX_MARGIN: ${MD_ADVERTISE_CTX_MARGIN:-8192}
      MD_ROUTE_ALPHA: ${MD_ROUTE_ALPHA:-4}
      MD_ROUTE_LOAD_UNIT_BYTES: ${MD_ROUTE_LOAD_UNIT_BYTES:-32768}
      MD_ROUTE_MAX_LOAD_UNITS: ${MD_ROUTE_MAX_LOAD_UNITS:-8}
      MD_ROUTE_JOURNAL: ${MD_ROUTE_JOURNAL:-true}
      # Local attested tokenization stays off until a Qwen compatibility
      # manifest and chat-template digest are generated and reviewed. Byte
      # fingerprint routing needs neither and is unaffected by model identity.
      MD_TOKENIZER_MODE: ${MD_TOKENIZER_MODE:-off}
      MD_TOKENIZER_PROFILE: ${MD_TOKENIZER_PROFILE:-qwen3.8-27b}
      MD_EXACT_ROUTE_MODE: ${MD_EXACT_ROUTE_MODE:-off}
      MD_UPSTREAM_ADMISSION_MODE: ${MD_UPSTREAM_ADMISSION_MODE:-http}
      # Native KV inventory is observation-only. Whether a hybrid
      # linear-attention model emits usable events is the open question this
      # deployment exists to answer -- do not promote past shadow on a guess.
      MD_KV_EVENT_MODE: ${MD_KV_EVENT_MODE:-shadow}
      MD_KV_EVENT_LIVE_ENDPOINTS: ${MD_KV_EVENT_LIVE_ENDPOINTS:-tcp://qwen38-a:5557,tcp://qwen38-b:5557}
      MD_KV_EVENT_REPLAY_ENDPOINTS: ${MD_KV_EVENT_REPLAY_ENDPOINTS:-tcp://qwen38-a:5558,tcp://qwen38-b:5558}
      MD_KV_EVENT_TOPIC: "${MD_KV_EVENT_TOPIC:-}"
      MD_KV_EVENT_REPLAY_LIMIT: ${MD_KV_EVENT_REPLAY_LIMIT:-8192}
      MD_KV_EVENT_TIMEOUT_MS: ${MD_KV_EVENT_TIMEOUT_MS:-180000}

  qwen38-a: &engine
    image: ${IMAGE:-voipmonitor/vllm:gilded-gnosis-v20-vllm4d006a4-b12xcd3ce19-fi1ac6942-cu132-20260810-r34}
    container_name: qwen38-a
    entrypoint: ["/opt/venv/bin/vllm", "serve", "/workspace/model"]
    restart: unless-stopped
    ipc: host
    init: true
    shm_size: 32gb
    # GPUs 0-3 are local to NUMA node 0; first-touch allocation follows these
    # CPUs and avoids cross-socket host/PCIe traffic.
    cpuset: "0-11,24-35"
    ulimits:
      memlock: -1
      stack: 67108864
      nofile:
        soft: 1048576
        hard: 1048576
    ports:
      - "127.0.0.1:8012:8000"
    volumes:
      - ${QWEN_MODEL_DIR:-/prod/models/Qwen/Qwen3.8-27B-FP8}:/workspace/model:ro
      - /prod/engine-cache:/root/.cache
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["0", "1", "2", "3"]
              capabilities: [gpu]
    environment:
      CUDA_DEVICE_ORDER: PCI_BUS_ID
      NCCL_P2P_DISABLE: ${NCCL_P2P_DISABLE:-0}
      VLLM_API_KEY: ${VLLM_API_KEY:-qwen-local}
    command:
      - --served-model-name=${SERVED_MODEL_NAME:-qwen3.8-27b}
      - --host=0.0.0.0
      - --port=8000
      - --tensor-parallel-size=4
      # The first boot measured a 4,642,861-token GPU KV cache at TP4, so the
      # model's native 262144 window costs roughly 17 full-length sequences
      # worth of residency and is affordable here.
      - --max-model-len=${MAX_MODEL_LEN:-262144}
      # 64 was the throughput limiter: two engines capped the stack at 128
      # concurrent sequences, and c256 saturated at ~5950 tok/s with the
      # surplus queued rather than batched. Raising it to 256 measured
      # ~7800 tok/s at c256, +32%, with no errors. A --max-num-batched-tokens
      # override was tested alongside it at 8192 and 16384 and made no
      # difference beyond noise, so it is deliberately not set here.
      - --max-num-seqs=${MAX_NUM_SEQS:-256}
      - --gpu-memory-utilization=${GPU_MEMORY_UTILIZATION:-0.90}
      - --enable-prefix-caching
      # Without a reasoning parser the model's <think> block is emitted inside
      # `content`, so every client sees raw chain-of-thought. The parser is
      # registered lazily in this image under the name `qwen3`.
      - --reasoning-parser=qwen3
      - --tool-call-parser=${TOOL_CALL_PARSER:-qwen3_xml}
      - --enable-auto-tool-choice
      # Vision limits are explicit so a malformed request cannot make one
      # prompt consume an unbounded share of the encoder.
      - --limit-mm-per-prompt={"image":${MM_IMAGE_LIMIT:-4},"video":${MM_VIDEO_LIMIT:-1}}
      - --kv-events-config={"enable_kv_cache_events":true,"publisher":"zmq","endpoint":"tcp://*:5557","replay_endpoint":"tcp://*:5558","buffer_steps":10000,"hwm":100000,"max_queue_size":100000,"topic":""}
      # Qwen3.8 ships generation_config.json defaults; pin top_p so callers
      # that omit it do not sample the full tail, matching the DeepSeek stack's
      # rationale for the same override.
      - --override-generation-config={"top_p":0.95}

  qwen38-b:
    <<: *engine
    container_name: qwen38-b
    # GPUs 4-7 are local to NUMA node 1.
    cpuset: "12-23,36-47"
    ports:
      - "127.0.0.1:8013:8000"
    deploy:
      resources:
        reservations:
          devices:
            - driver: nvidia
              device_ids: ["4", "5", "6", "7"]
              capabilities: [gpu]
