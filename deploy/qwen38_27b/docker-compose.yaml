# Canonical source: helixml/ramjet/deploy/qwen38_27b/docker-compose.yaml
#
# Qwen3.8-27B-NVFP4 on 8x RTX PRO 6000 Blackwell (SM120), x86: eight
# single-GPU SGLang engines with the DFlash2 block-8 draft, behind the ramjet
# load balancer.
#
# THIS IS THE WHOLE DEPLOYMENT. One file, no overlays, no `-f` stack:
#
#     docker compose up -d                      # whole stack
#     docker compose up -d --no-deps ds4-loadbalancer   # LB only
#
# It carries the best known configuration. There is deliberately no second
# file holding a worse one. Two production incidents came from the overlay
# stack this replaces:
#
#   * The on-box copy of this file drifted to an older LB_IMAGE default. Any
#     recreate that did not pass LB_IMAGE explicitly silently downgraded the
#     load balancer to v0.3.0 and stayed there unnoticed until the missing
#     stream_tps metrics were spotted. (EXPERIMENTS.md 2026-08-23)
#   * Compose cannot append to a command list, so a torch.compile overlay had
#     to restate the engine command in full. A flag added to the topology file
#     alone was silently dropped, because that overlay was always applied.
#
# Both failure modes are structural to overlays, not mistakes to be more
# careful about. If you need to try an alternative, change this file on a
# branch, or pass an environment variable -- every tunable below has a
# ${VAR:-default} form. Do not add another Compose file.
#
# The model is a hybrid stack -- Gated DeltaNet linear attention in three of
# every four layers, full attention in the fourth (`layer_types` in
# config.json). Its concurrency ceiling comes from the mamba state cache, not
# KV or the GPU; see the --mamba-ssm-dtype note on the command below.
#
# Checkpoints (HF): RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead at immutable
# revision 009632fef96dd349150baa780c984e62e70e91fe (target; NVFP4/FP8 body,
# dense BF16 lm_head required by the DFlash2 selector on this qualified pin)
# and z-lab/Qwen3.8-27B-DFlash2 (draft, block size 8). Keep the target's
# revision in both the host-directory name and the container labels below;
# changing a mutable Hub main revision in place is not a production rollout.
#
# PINNING CAVEAT: DFlash2 draft support (`DFlash2DraftModel`) is newer than the
# cookbook image, so this bind-mounts an sglang source checkout over the
# image's python tree. Pin the checkout to the qualified commit:
#
#   git -C /prod/src/sglang checkout 38b74d294
#
# Replace SGLANG_IMAGE with a self-contained pinned image and drop
# SGLANG_SRC_DIR as soon as an upstream tag ships DFlash2 support.

x-sglang-engine: &sglang-engine
  image: ${SGLANG_IMAGE:-lmsysorg/sglang:qwen38-27b}
  labels:
    ai.ramjet.model.repository: RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead
    ai.ramjet.model.revision: 009632fef96dd349150baa780c984e62e70e91fe
  entrypoint: ["python3", "-m", "sglang.launch_server"]
  restart: unless-stopped
  init: true
  shm_size: 32gb
  ulimits:
    memlock: -1
    stack: 67108864
    nofile: {soft: 1048576, hard: 1048576}
  volumes:
    - ${NVFP4_MODEL_DIR:-/prod/models/RadixArk/Qwen3.8-27B-NVFP4-BF16-LMHead-009632fef96d}:/workspace/model:ro
    - ${DFLASH2_DRAFT_DIR:-/prod/models/z-lab/Qwen3.8-27B-DFlash2}:/workspace/draft:ro
    - ${SGLANG_SRC_DIR:-/prod/src/sglang}/python/sglang:/sgl-workspace/sglang/python/sglang:ro
    - ${SGLANG_CACHE_DIR:-/prod/engine-cache-sglang}:/root/.cache
  environment:
    CUDA_DEVICE_ORDER: PCI_BUS_ID

x-sglang-command: &sglang-command
  - --model-path=/workspace/model
  - --served-model-name=${SERVED_MODEL_NAME:-qwen3.8-27b}
  - --host=0.0.0.0
  - --port=8000
  - --api-key=${VLLM_API_KEY:-qwen-local}
  - --speculative-algorithm=DFLASH
  - --speculative-draft-model-path=/workspace/draft
  - --speculative-num-draft-tokens=${DFLASH_DRAFT_TOKENS:-8}
  - --enable-cache-report
  - --reasoning-parser=qwen3
  - --tool-call-parser=${SGLANG_TOOL_CALL_PARSER:-qwen3_coder}
  - --mamba-ssm-dtype=${MAMBA_SSM_DTYPE:-bfloat16}
  - --enable-metrics
  - --enable-torch-compile
  - --torch-compile-max-bs=8
  - --mem-fraction-static=0.85

services:
  ds4-loadbalancer:
    # Container name is retained so existing bench scripts, the deployment
    # lock, and the Prometheus scrape target keep working. It is older than the
    # project's current name and is deliberately not chased through a rename;
    # the metric prefix moved to ramjet_ separately, which is what the
    # dashboards actually query.
    # Override only with another immutable tag+digest pair. This pin is the
    # v0.4.0 release qualified on node06 on 2026-08-20; its OCI revision is
    # 1d0223e. Rollback target is the v0.3.0 pin
    # sha256:2489110adbed61b7a2a415784d817d48803c234c97509fd2e0eb180c5e7453b3;
    # rolling back predates the stream_tps serving fields, so the machine-view
    # Stream tok/s tile goes empty until rolled forward again.
    # It must stay a post-rename image: the RJ_ settings below are ignored by
    # anything older, which would come up healthy and differently tuned.
    image: ${LB_IMAGE:-ghcr.io/helixml/ramjet:v0.4.0@sha256:467e7edf40c8fcad29e741cbba52ca571cbae0261d94cff008aa6bcdb737ea1b}
    container_name: ds4-loadbalancer
    restart: unless-stopped
    ports:
      - "127.0.0.1:8006:8000"
      - "127.0.0.1:8007:9090"
      # node06 publishes the observation-only machine view on Tailscale.
      - "100.89.187.17:8007:9090"
    volumes:
      - /var/lib/ramjet-machineview:/machineview
    environment:
      RJ_UPSTREAM: ${RJ_UPSTREAM:-http://qwen38-sg-e0:8000,http://qwen38-sg-e1:8000,http://qwen38-sg-e2:8000,http://qwen38-sg-e3:8000,http://qwen38-sg-e4:8000,http://qwen38-sg-e5:8000,http://qwen38-sg-e6:8000,http://qwen38-sg-e7:8000}
      RJ_UPSTREAM_TOKEN: ${VLLM_API_KEY:-qwen-local}
      RJ_ADVERTISE_CTX_MARGIN: ${RJ_ADVERTISE_CTX_MARGIN:-8192}
      # Explicitly parameterized so a qualified replacement model can preserve
      # six-figure output budgets during a one-engine handoff. The 27B default
      # retains ramjet's legacy compatibility sentinel.
      RJ_MAX_TOKENS_STRIP: ${RJ_MAX_TOKENS_STRIP:-100000}
      RJ_ROUTE_ALPHA: ${RJ_ROUTE_ALPHA:-4}
      RJ_ROUTE_LOAD_UNIT_BYTES: ${RJ_ROUTE_LOAD_UNIT_BYTES:-32768}
      RJ_ROUTE_MAX_LOAD_UNITS: ${RJ_ROUTE_MAX_LOAD_UNITS:-8}
      RJ_ROUTE_JOURNAL: ${RJ_ROUTE_JOURNAL:-true}
      # Local attested tokenization stays off until a Qwen compatibility
      # manifest and chat-template digest are generated and reviewed. Byte
      # fingerprint routing needs neither and is unaffected by model identity.
      RJ_TOKENIZER_MODE: ${RJ_TOKENIZER_MODE:-off}
      RJ_TOKENIZER_PROFILE: ${RJ_TOKENIZER_PROFILE:-qwen3.8-27b}
      RJ_EXACT_ROUTE_MODE: ${RJ_EXACT_ROUTE_MODE:-off}
      RJ_UPSTREAM_ADMISSION_MODE: ${RJ_UPSTREAM_ADMISSION_MODE:-http}
      # SGLang publishes no ZMQ KV-event stream. Off, not shadow: a shadow
      # consumer pointed at nothing logs connect failures forever without ever
      # becoming trusted. The snapshot companion and digest index do not apply
      # to this engine either.
      RJ_KV_EVENT_MODE: "off"
      RJ_KV_EVENT_LIVE_ENDPOINTS: ""
      RJ_KV_EVENT_REPLAY_ENDPOINTS: ""

      # Machine view is observation-only and publishes on the metrics listener.
      # The host agent stays loopback; the LB reaches it via this project's
      # bridge gateway.
      RJ_MACHINEVIEW_AGENT_URL: http://172.19.0.1:8016/sample
      RJ_MACHINEVIEW_STATE_PATH: /machineview/state.json

      # Idle drain stays in observe: it publishes what it *would* park and
      # fences nothing. Observe is consequence-free by construction -- the
      # binary refuses to actuate outside drain mode -- so the actuator setting
      # is inert here. Promote only after a quiet window shows
      # ramjet_idle_drain_state reaching 2 on exactly one replica and returning
      # to 0 on traffic, with safe_to_stop and engine_park_state pinned at 0.
      RJ_IDLE_DRAIN_MODE: ${RJ_IDLE_DRAIN_MODE:-observe}
      RJ_IDLE_DRAIN_RELEASE: ${RJ_IDLE_DRAIN_RELEASE:-fleet-idle}
      RJ_IDLE_DRAIN_UPSTREAM_IDLE_AFTER_SECONDS: ${RJ_IDLE_DRAIN_UPSTREAM_IDLE_AFTER_SECONDS:-600}
      RJ_IDLE_DRAIN_RESUME_LOAD_PER_REPLICA: ${RJ_IDLE_DRAIN_RESUME_LOAD_PER_REPLICA:-4}
      # Deliberately long: parking too eagerly costs a wake latency on live
      # traffic, parking too late costs a few hundred watt-minutes.
      RJ_IDLE_DRAIN_IDLE_AFTER_SECONDS: "900"
      RJ_IDLE_DRAIN_MIN_WARM: "1"
      RJ_IDLE_DRAIN_COOLDOWN_SECONDS: "300"
      RJ_IDLE_DRAIN_GRACE_SECONDS: "30"
      RJ_IDLE_DRAIN_INTERVAL_SECONDS: "15"

  qwen38-sg-e0:
    <<: *sglang-engine
    container_name: qwen38-sg-e0
    # GPUs 0-3 are local to NUMA node 0, 4-7 to node 1; first-touch
    # allocation follows these CPUs (same split as the vLLM topologies).
    cpuset: "0-11,24-35"
    ports: ["127.0.0.1:8030:8000"]
    deploy:
      resources:
        reservations:
          devices:
            - {driver: nvidia, device_ids: ["0"], capabilities: [gpu]}
    command: *sglang-command

  qwen38-sg-e1:
